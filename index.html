<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Widget Page Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: top bar · real-size iframe preview scaled to fit (left) · grouped control rail (right); stacks on narrow screens */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --line:#D9DCE6; --fg:#171A2B; --muted:#5E6378;
  --accent:#2B2BB0; --accent-fg:#FFFFFF; --stage:#E2E5EE; --warn:#8A5200; --warn-bg:#FFF3DC; --sel:#FF5A36;
  --ui:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131C; --surface:#191C28; --line:#2C3042; --fg:#E7E9F2; --muted:#9AA0B8;
  --accent:#9C9CFF; --accent-fg:#0E1030; --stage:#0B0D14; --warn:#F2B54A; --warn-bg:#2B2210; --sel:#FF7A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131C; --surface:#191C28; --line:#2C3042; --fg:#E7E9F2; --muted:#9AA0B8;
  --accent:#9C9CFF; --accent-fg:#0E1030; --stage:#0B0D14; --warn:#F2B54A; --warn-bg:#2B2210; --sel:#FF7A5C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;color:var(--muted)}
.seg button:disabled{opacity:.4;cursor:default}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 8px;font-size:12px}
select.dev{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:13px}
.reset-wrap{display:inline-flex;gap:6px;align-items:center}
.reset-wrap small{color:var(--muted)}

.main{display:grid;grid-template-columns:232px minmax(0,1fr) 370px;min-height:0}
.outline{background:var(--surface);border-right:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 12px 16px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.ol-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ol-head b{font-size:13px}
.ol-head .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.sec-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sec-item{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.sec-item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.si-main{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 9px;min-width:0}
.si-main .sw{width:34px;height:34px;border-radius:6px;flex:none}
.si-txt{display:grid;min-width:0}
.si-txt small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.si-txt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-acts{display:flex;gap:2px;padding:0 6px 6px;flex-wrap:wrap}
.si-acts .btn{padding:2px 7px;font-size:11.5px}
.si-acts .btn.danger{color:#C2341B;border-color:#C2341B}
.sec-item:not(.on) .si-acts{display:none}
.add-sec{width:100%}
.ol-tip{margin:0}
.pk-sheet{width:min(980px,100%);grid-template-rows:auto 1fr}
.pk-body{overflow:auto;padding:16px 18px 20px;display:grid;gap:18px}
.pk-group h3{margin:0 0 10px;font-size:14px;color:var(--fg);font-weight:700}
.pk-group h3 small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.pk-sub{display:grid;gap:8px;margin-bottom:14px}
.pk-sub h4{margin:0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pk-empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:12.5px;color:var(--muted)}
#pk-tabs small{font-family:var(--mono);opacity:.7}
.stage{position:relative;overflow:auto;background:var(--stage);display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;width:100%;max-width:1200px}
.tpl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.tpl:hover:not(:disabled){border-color:var(--muted)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tpl:disabled{cursor:not-allowed;opacity:.62}
.tpl .sw{grid-row:span 3;width:44px;height:44px;border-radius:7px;position:relative;overflow:hidden}
.tpl .no{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tpl b{font-size:14px;line-height:1.25;letter-spacing:-.01em;min-width:0}
.tpl small{font-size:11.5px;color:var(--muted);line-height:1.35;min-width:0}
.stage-meta{color:var(--muted);font-size:12px;font-family:var(--mono);text-align:center}
.stage-meta kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}
.holder{position:relative;flex:none;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px rgba(10,14,40,.16)}
.holder.phone{border-radius:10px;outline:7px solid var(--fg)}
#view{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff;display:block}

.rail{background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.rail details{border-bottom:1px solid var(--line)}
.rail summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 16px;font-weight:600;cursor:pointer;user-select:none}
.rail summary::-webkit-details-marker{display:none}
.rail summary small{font-weight:400;color:var(--muted);font-size:11.5px}
.rail summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
.rail details[open] summary::after{transform:rotate(-135deg)}
.rail details.hot summary{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rail details.hot .dot{background:var(--sel)}
.fields{display:grid;gap:14px;padding:2px 16px 18px}
.sub{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;text-transform:uppercase}
.f{display:grid;gap:6px;min-width:0}
.f > label,.f > .lab{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.chip{font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:99px;background:var(--bg);color:var(--accent);border:1px solid var(--line)}
.orig{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);opacity:.8}
.row{display:flex;gap:8px;align-items:center;min-width:0}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
input.num{width:70px;text-align:right;font-family:var(--mono);font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.unit{font-family:var(--mono);font-size:11px;color:var(--muted);width:26px}
input.txt,.rail select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:58px;line-height:1.45}
input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);flex:none}
.hex{font-family:var(--mono);font-size:12px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--fg);cursor:pointer}
.tog input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{transform:translateX(14px)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.45}
.thumb{width:56px;height:56px;border-radius:6px;border:1px solid var(--line);object-fit:contain;flex:none;
  background:repeating-conic-gradient(var(--bg) 0 25%,var(--surface) 0 50%) 0 0/10px 10px}
.img-f{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start}
.img-actions{display:grid;gap:6px;min-width:0}
.file-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.seg.full{display:flex}
.seg.full button{flex:1}
.slides{display:grid;gap:8px}
.slide{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px}
.slide.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slide .tb{border:0;padding:0;background:none;position:relative}
.slide .tb span{position:absolute;left:3px;top:3px;font-family:var(--mono);font-size:10px;background:var(--fg);color:var(--bg);border-radius:4px;padding:0 4px}
.slide .ctrls{display:grid;gap:6px;min-width:0}
.slide .row .btn{padding:3px 7px}
.slide.dn{grid-template-columns:minmax(0,1fr);gap:8px}
.dn-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dn-head b{font-size:12px;font-family:var(--mono);margin-right:auto}
.dn-head .btn{padding:3px 7px}
.slide.dn label.mini{font-size:11px;color:var(--muted);display:grid;gap:4px}

.modal{position:fixed;inset:0;background:rgba(8,10,24,.55);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(860px,100%);max-height:100%;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header b{font-size:15px;margin-right:auto}
.sheet .steps{padding:12px 18px 0;display:grid;gap:8px;font-size:13px}
.sheet .steps ol{margin:0;padding-left:20px;display:grid;gap:2px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px}
.sheet textarea{font-family:var(--mono);font-size:11.5px;margin:12px 18px 0;width:auto;min-height:260px;resize:none;white-space:pre;overflow:auto}
.sheet footer{display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap}
.sheet footer .meta{margin-right:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.img-sheet{width:min(560px,100%);grid-template-rows:auto 1fr auto}
.img-body{padding:16px 18px;display:grid;gap:16px;overflow:auto}
.img-item{display:grid;gap:8px}
.img-item > b{font-size:13px}
.img-prev{width:100%;max-height:240px;aspect-ratio:16/9;object-fit:contain;border:1px solid var(--line);border-radius:8px;
  background:repeating-conic-gradient(var(--bg) 0 25%,var(--surface) 0 50%) 0 0/14px 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}

@media (max-width:1180px){
  .main{grid-template-columns:200px minmax(0,1fr) 330px}
}
@media (max-width:900px){
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .outline{border-right:0;border-bottom:1px solid var(--line);padding-right:max(12px,env(safe-area-inset-right,0px))}
  .rail{border-left:0;border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px)}
  .stage{padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="app">
  <div class="bar">
    <div class="brand"><b>Widget Page Builder</b><span id="brand-sub">페이지</span></div>
    <select class="dev" id="dev" aria-label="미리보기 화면 크기">
      <option value="1920x1080" selected>PC 1920×1080</option>
      <option value="768x1024">태블릿 768×1024</option>
      <option value="390x844">모바일 390×844</option>
    </select>
    <div class="seg" role="group" aria-label="미리보기 움직임">
      <button id="mv-on" aria-pressed="true">움직임 켜기</button>
      <button id="mv-off" aria-pressed="false">멈춤</button>
    </div>
    <div class="seg" role="group" aria-label="되돌리기">
      <button id="undo" title="되돌리기 (⌘Z / Ctrl+Z)" aria-label="되돌리기" disabled>↶ 되돌리기</button>
      <button id="redo" title="다시 실행 (⌘⇧Z / Ctrl+Y)" aria-label="다시 실행" disabled>↷</button>
    </div>
    <button class="btn" id="play">▶ 처음부터 재생</button>
    <span class="reset-wrap" id="reset-wrap"><button class="btn ghost" id="reset">기본값으로 초기화</button></span>
    <button class="btn primary" id="export">HTML 내보내기</button>
  </div>
  <div class="main">
    <nav class="outline" aria-label="페이지 구성">
      <div class="ol-head"><b>페이지 구성</b><button type="button" class="btn sm ghost" id="pg-set" aria-pressed="false">페이지 설정</button></div>
      <ol class="sec-list" id="sec-list"></ol>
      <button type="button" class="btn primary add-sec" id="add-sec">+ 섹션 추가</button>
      <p class="hint ol-tip">미리보기에서 섹션을 클릭해도 선택돼요. 새 섹션은 선택한 섹션 바로 아래에 들어가요. 다른 위젯으로 교체하려면 섹션의 <b>바꾸기</b>를 누르세요.</p>
    </nav>
    <div class="stage" id="stage">
      <div class="holder" id="holder"><iframe id="view" title="히어로 미리보기"></iframe></div>
      <div class="stage-meta" id="meta"></div>
    </div>
    <aside class="rail" id="rail" aria-label="요소 설정"></aside>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <header>
      <b id="m-title">코드 내보내기</b>
      <div class="seg" role="group" aria-label="내보내기 형식">
        <button id="tab-page" aria-pressed="true">페이지 HTML</button>
        <button id="tab-sec" aria-pressed="false">선택한 섹션만</button>
        <button id="tab-json" aria-pressed="false">페이지 데이터(JSON)</button>
      </div>
    </header>
    <div class="steps" id="m-steps"></div>
    <textarea id="m-out" spellcheck="false" aria-label="내보낸 코드"></textarea>
    <footer>
      <span class="meta" id="m-meta"></span>
      <button class="btn" id="m-apply" hidden>이 설정 적용</button>
      <button class="btn" id="m-close">닫기</button>
      <button class="btn primary" id="m-copy">복사</button>
    </footer>
  </div>
</div>
<div class="modal" id="picker" hidden>
  <div class="sheet pk-sheet" role="dialog" aria-modal="true" aria-labelledby="pk-title">
    <header><b id="pk-title">섹션 추가</b><div class="seg" id="pk-tabs" role="group" aria-label="위젯 종류"></div><button type="button" class="btn" id="pk-close">닫기</button></header>
    <div class="pk-body" id="pk-body"></div>
  </div>
</div>
<div class="modal" id="imgdlg" hidden>
  <div class="sheet img-sheet" role="dialog" aria-modal="true" aria-labelledby="i-title">
    <header><b id="i-title">이미지 바꾸기</b></header>
    <div class="img-body" id="i-body"></div>
    <footer><span class="meta" id="i-meta"></span><button class="btn" id="i-cancel">취소</button><button class="btn primary" id="i-apply">적용</button></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
/* ================= shared helpers ================= */
const uid = () => Math.random().toString(36).slice(2,8);
const R = (d,m) => ({d,m});
const A = (k,l,min,max,step,u,extra={}) => ({k,l,t:'range',min,max,step,u,...extra});
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const n = (v,d=3) => +(+v).toFixed(d);
const clampF = t => `clamp(${t.min}px, ${t.vw}vw, ${t.max}px)`;
const rgba = (hex, a) => { const h = hex.replace('#',''); return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; };
const pick = (obj,k) => k.split('.').reduce((o,p)=>o?.[p], obj);

/* ================= fonts ================= */
const FONTS = {
  'Pretendard Variable':{css:'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css', weight:'45 920', preview:'p/pretendard.woff2', label:'Pretendard'},
  'GmarketSansMedium':  {custom:'https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff', fmt:'woff', weight:'500', preview:'p/gm-Medium.woff', label:'G마켓 산스 Medium'},
  'GmarketSansBold':    {custom:'https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff', fmt:'woff', weight:'700', preview:'p/gm-Bold.woff', label:'G마켓 산스 Bold'},
  'Black Han Sans':     {g:'Black+Han+Sans'},
  'Jua':                {g:'Jua'},
  'Do Hyeon':           {g:'Do+Hyeon'},
  'Gothic A1':          {g:'Gothic+A1:wght@500;600;700;800;900'},
  'Noto Sans KR':       {g:'Noto+Sans+KR:wght@400;500;600;700;800;900'},
  'Plus Jakarta Sans':  {g:'Plus+Jakarta+Sans:wght@300;400;500;600;700;800'},
  'Geist':              {g:'Geist:wght@400;500;600;700;800'},
  'Fraunces':           {g:'Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700'},

  }

  // same flow as the original main.js: fade slides, play the active video, fill the bar for the video's length
  function run(root, o){
    var slides = root.querySelectorAll('.dn-slide'), txts = root.querySelectorAll('.dn-txt'), n = slides.length;
    var bar = root.querySelector('.dn-bar i'), line = root.querySelector('.dn-line i'), idxEl = root.querySelector('.dn-idx');
    var idx = 0, timer = null, endTimer = null, token = 0, dead = false;
    if (!n) return function(){};
    for (var s=0;s<n;s++) if (slides[s].classList.contains('is-on')) idx = s;
    var pad = function(x){ return x <= 9 ? '0'+x : ''+x; };
    var vid = function(i){ return slides[i] ? slides[i].querySelector('video') : null; };
    var play = function(i){
      for (var j=0;j<n;j++){ var w = vid(j); if (w && j !== i) w.pause(); }
      var v = vid(i); if (!v) return;
      try { v.currentTime = 0; } catch(e){}
      var p = v.play(); if (p && p.catch) p.catch(function(){});
    };
    var fill = function(ms){
      ms = Math.max(ms || o.auto, 1000);
      clearTimeout(timer);
      if (bar){ bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth; bar.style.transition = 'width ' + ms + 'ms linear'; bar.style.width = '100%'; }
      timer = setTimeout(function(){ show(idx + 1); }, ms);
    };
    var length = function(i){
      var v = vid(i);
      if (!o.useVideo || !v) return o.auto;
      return (isFinite(v.duration) && v.duration > 0) ? Math.max(Math.round((v.duration - v.currentTime) * 1000), 1000) : null;
    };
    var sync = function(i){
      var t = ++token, d = length(i), v = vid(i);
      if (d){ fill(d); return; }
      clearTimeout(timer);
      if (bar){ bar.style.transition = 'none'; bar.style.width = '0'; }
      var start = function(){ if (dead || t !== token || idx !== i) return; fill(length(i) || o.auto); };
      v.addEventListener('playing', start, {once:true});
      v.addEventListener('loadedmetadata', start, {once:true});
      setTimeout(start, 350);
    };
    var text = function(i){
      for (var k=0;k<txts.length;k++){ txts[k].classList.remove('is-anim'); txts[k].classList.toggle('is-on', k === i); }
      requestAnimationFrame(function(){ if (txts[i]) txts[i].classList.add('is-anim'); });
    };
    var show = function(i, first){
      i = (i % n + n) % n;
      idx = i; token++;
      clearTimeout(timer); clearTimeout(endTimer);
      for (var k=0;k<n;k++) slides[k].classList.toggle('is-on', k === i);
      if (bar){ bar.style.transition = 'none'; bar.style.width = '0'; }
      if (line) line.style.width = 'calc((100% / ' + n + ') * ' + (i + 1) + ')';
      if (idxEl) idxEl.textContent = pad(i + 1);
      text(i);
      if (first){ play(i); sync(i); return; }
      endTimer = setTimeout(function(){ if (dead || idx !== i) return; play(i); sync(i); }, o.speed);
    };
    var prev = root.querySelector('.dn-prev'), next = root.querySelector('.dn-next');
    var onPrev = function(){ show(idx - 1); }, onNext = function(){ show(idx + 1); };
    if (prev) prev.addEventListener('click', onPrev);
    if (next) next.addEventListener('click', onNext);
    show(idx, true);
    return function(){
      dead = true; clearTimeout(timer); clearTimeout(endTimer);
      if (prev) prev.removeEventListener('click', onPrev);
      if (next) next.removeEventListener('click', onNext);
      for (var j=0;j<n;j++){ var w = vid(j); if (w) w.pause(); }
    };
  }
  const cfg = st => ({speed:st.play.speed, auto:st.play.auto, useVideo:st.play.useVideo});

    var draw = function(){
      var h = '';
      for (var off = -o.half; off <= o.half; off++){

${st.cta.show ? `  <div class="lg-cta-row rv" style="--ry:16px"><a class="lg-cta" href="${esc(st.cta.href)}">${layer('')}<span class="lg-fill lg-wipe" aria-hidden="true"></span>${layer('lg-wipe lg-top')}</a></div>\n` : ''}</section>`;

function bindEdit(){
  doc.addEventListener('dblclick', e => {
    const hit = doc.elementFromPoint(e.clientX, e.clientY) || e.target;
    const el = hit.closest('[data-edit]');
    if (el){ if (el.isContentEditable) return; e.preventDefault(); startEdit(el.dataset.edit); return; }
    const im = hit.closest('[data-img]'); if (!im) return;
    e.preventDefault();
    let spec = im.dataset.img;
    if (spec.includes('#')){
      const ss = [...im.querySelectorAll('.hw-slide')];
      spec = spec.replace('#', Math.max(0, ss.findIndex(x => x.classList.contains('is-active'))));
    }
    openImg(spec.split('|'));
  });
  doc.addEventListener('keydown', e => {
    if (!editing) return;
    if (e.key === 'Escape'){ e.preventDefault(); endEdit(false); }
    else if (e.key === 'Enter'){
      e.preventDefault();
      if (editing.multi && !(e.metaKey || e.ctrlKey)) doc.execCommand('insertLineBreak');
      else endEdit(true);
    }
  }, true);
  doc.addEventListener('paste', e => {
    if (!editing) return;
    e.preventDefault();
    let t = (e.clipboardData || view.contentWindow.clipboardData).getData('text/plain');
    if (!editing.multi) t = t.replace(/\s*\n\s*/g,' ');
    doc.execCommand('insertText', false, t);
  });
  doc.addEventListener('focusout', e => { if (editing && e.target === editing.el) endEdit(true); });
}
function bindDrag(){
  bindEdit();
  doc.addEventListener('pointerdown', e => {
    if (e.target.closest('[contenteditable="true"]')) return;
    const w = e.target.closest('[data-sec]');
    if (w && +w.dataset.sec !== store.cur) switchSection(+w.dataset.sec);
    const el = e.target.closest('[data-el]'); if (!el) return;
    const k = el.dataset.el; select(k);
    if (!T.drag[k]) return;
    e.preventDefault();
    drag = {k, sx:e.clientX, sy:e.clientY, o:baseOf(k), moved:false};
    try { doc.body.setPointerCapture?.(e.pointerId); } catch(_){}
  });
  doc.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (!drag.moved && Math.hypot(dx,dy) < 3) return;
    if (!drag.moved){ drag.moved = true; doc.body.classList.add('dragging'); }
    moveBy(drag.k, Math.round(dx), Math.round(dy), drag.o);
    renderCSS(); sync();
  });
  const end = () => { if (!drag) return; doc.body.classList.remove('dragging'); if (drag.moved){ save(); render(); } drag = null; };
  doc.addEventListener('pointerup', end); doc.addEventListener('pointercancel', end);
  doc.addEventListener('keydown', e => { if (!editing) nudge(e); });
}
function nudge(e){
  if (editing) return;
  if (!selected || !T.drag || !T.drag[selected] || !$('modal').hidden) return;
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  const st = e.shiftKey ? 10 : 1;
  const m = {ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if (!m){ if (e.key==='Escape') select(null,false); return; }
  e.preventDefault();
  moveBy(selected, m[0], m[1], baseOf(selected));
  renderCSS(); sync(); save();
}
document.addEventListener('keydown', nudge);
function select(k, scroll=true){
  selected = k; markSel();

  rail.querySelectorAll('details').forEach(d => d.classList.toggle('hot', d.dataset.g===g));
  const d = rail.querySelector(`details[data-g="${g}"]`);

}

      if (c.t === 'select') return `<label class="mini">${c.l}<select data-lf="${c.k}">${(typeof c.opts === 'function' ? c.opts(S) : c.opts).map(([ov,ol]) => `<option value="${ov}"${ov===v?' selected':''}>${ol}</option>`).join('')}</select></label>`;
      return `<label class="mini">${c.l}<input class="txt" data-lf="${c.k}" value="${esc(v)}"></label>`;
    }).join('\n    ')}
  </div>`).join('');
}
function dnSlidesHTML(){
  const sl = S.slides;
  return sl.map((s,i) => `<div class="slide dn${i===showSlide?' on':''}" data-i="${i}">
    <div class="dn-head"><b>SLIDE ${String(i+1).padStart(2,'0')}</b>
      <button type="button" class="btn sm ghost" data-act="dn-show">보기</button>
      <button type="button" class="btn sm ghost" data-act="dn-up" ${i?'':'disabled'} aria-label="앞으로">↑</button>
      <button type="button" class="btn sm ghost" data-act="dn-down" ${i<sl.length-1?'':'disabled'} aria-label="뒤로">↓</button>
      <button type="button" class="btn sm ghost" data-act="dn-del" ${sl.length>1?'':'disabled'}>삭제</button></div>
    <label class="mini">큰 제목<textarea data-dn="title" rows="2">${esc(s.title)}</textarea></label>
    <label class="mini">설명<input class="txt" data-dn="desc" value="${esc(s.desc)}"></label>
    <label class="mini">배경 영상 주소 (mp4)<input class="txt" data-dn="video" value="${esc(s.video)}" placeholder="https://…/video.mp4"></label>
    <label class="mini">대표 이미지 (영상이 뜨기 전·안 될 때)<input class="txt" data-dn="poster" value="${esc(s.poster.startsWith('data:')?'':s.poster)}" placeholder="${s.poster.startsWith('data:')?`업로드한 파일 · ${Math.round(s.poster.length*.75/1024)}KB`:'이미지 주소 (선택)'}"></label>
    <div class="row"><span class="btn sm file-btn">대표 이미지 업로드<input type="file" accept="image/*" data-dn-file aria-label="${i+1}번 대표 이미지 업로드"></span>
      ${s.poster?'<button type="button" class="btn sm ghost" data-act="dn-noposter">이미지 빼기</button>':''}</div>
    <label class="tog">어둡게 필터<input type="checkbox" data-dn="filter" ${s.filter?'checked':''}></label>
  </div>`).join('');
}
function buildRail(fresh=false){
  const open = fresh ? [] : [...rail.querySelectorAll('details[open]')].map(d=>d.dataset.g);
  rail.innerHTML = T.groups.map((g,i) => `<details data-g="${g.id}" ${open.includes(g.id)||(!open.length&&i===0)?'open':''}>
    <summary><span class="dot"></span>${g.title}</summary><div class="fields">${g.fields.map(fieldHTML).join('')}</div></details>`).join('');
  if (fresh) rail.scrollTop = 0;
  sync();
  select(selected, false);
}
function sync(except){
  rail.querySelectorAll('[data-k]').forEach(el => {
    if (el===except) return;
    const k = el.dataset.k, v = get(k), f = FIELD[k];
    if (f.t==='align') el.setAttribute('aria-pressed', String(el.dataset.v===v));
    else if (el.type==='checkbox') el.checked = !!v;
    else if (el.dataset.url!==undefined) el.value = String(v).startsWith('data:') ? '' : v;
    else el.value = v;
  });
  rail.querySelectorAll('[data-thumb]').forEach(img => {
    const k = img.dataset.thumb, v = getRaw(k); img.src = pv(v);
    rail.querySelector(`[data-imghint="${k}"]`).textContent = v===FIELD[k].def ? '기본 더미 이미지예요. 실제 이미지로 바꿔주세요.' :
      v.startsWith('data:') ? `업로드한 파일 · 약 ${Math.round(v.length*.75/1024)}KB가 코드에 들어갑니다.` : '입력한 주소의 사진을 씁니다.';
  });
  rail.querySelectorAll('[data-chip]').forEach(c => c.textContent = dk()==='m'?'모바일':'데스크톱');
  const sl = $('slides'); if (sl && !sl.contains(document.activeElement)) sl.innerHTML = slidesHTML();
  const dl = $('dnslides'); if (dl && !dl.contains(document.activeElement)) dl.innerHTML = dnSlidesHTML();
  rail.querySelectorAll('[data-list]').forEach(el => { if (!el.contains(document.activeElement)) el.innerHTML = listHTML(FIELD[el.dataset.list]); });
}
function parse(el){
  const f = FIELD[el.dataset.k];
  if (f.t==='range'){ const v = parseFloat(el.value); return isNaN(v) ? null : v; }
  if (f.t==='toggle') return el.checked;
  if (el.dataset.hex!==undefined) return /^#[0-9a-f]{6}$/i.test(el.value) ? el.value.toUpperCase() : null;
  if (f.t==='color') return el.value.toUpperCase();
  return el.value;
}
rail.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.lf){
    const card = el.closest('[data-lk]'), L = getRaw(card.dataset.lk), i = +card.dataset.i;
    if (el.dataset.lurl !== undefined){ const v = el.value.trim(); if (!v) return; L[i][el.dataset.lf] = v; const th = card.querySelector('.thumb'); if (th) th.src = pv(v); }
    else if (el.type === 'checkbox') L[i][el.dataset.lf] = el.checked;
    else if (el.dataset.lnum !== undefined){ const v = parseFloat(el.value); if (isNaN(v)) return; L[i][el.dataset.lf] = v; }
    else if (el.dataset.lhex !== undefined){ if (!/^#[0-9a-f]{6}$/i.test(el.value)) return; L[i][el.dataset.lf] = el.value.toUpperCase(); const cp = el.parentNode.querySelector('input[type=color]'); if (cp) cp.value = el.value; }
    else if (el.type === 'color'){ L[i][el.dataset.lf] = el.value.toUpperCase(); const hx = el.parentNode.querySelector('[data-lhex]'); if (hx) hx.value = el.value.toUpperCase(); }
    else L[i][el.dataset.lf] = el.value;
    showSlide = i; render(); save(); return;
  }
  if (el.dataset.dn){
    const i = +el.closest('.slide').dataset.i, k = el.dataset.dn;
    if (k==='filter') S.slides[i].filter = el.checked;
    else if (k==='poster'){ if (!el.value.trim() && S.slides[i].poster.startsWith('data:')) return; S.slides[i].poster = el.value.trim(); }
    else S.slides[i][k] = k==='video' ? el.value.trim() : el.value;
    showSlide = i; render(); save(); return;
  }
  if (el.dataset.slideUrl!==undefined){
    const i = +el.closest('.slide').dataset.i, v = el.value.trim();
    if (v){ S.pot.slides[i].src = v; render(); save(); }
    return;
  }
  if (!el.dataset.k) return;
  if (el.dataset.url!==undefined){ if (!el.value.trim()) return; set(el.dataset.k, el.value.trim()); render(); sync(el); save(); return; }
  const v = parse(el); if (v===null) return;
  set(el.dataset.k, v); render(); sync(el); save();
});
rail.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lact){
    const k = b.dataset.lk || b.closest('[data-lk]').dataset.lk, f = FIELD[k], L = getRaw(k), i = +b.closest('[data-i]')?.dataset.i, a = b.dataset.lact;
    if (a==='show'){ showSlide = i; if (moving) setMoving(false); else render(); refreshLists(); return; }
    if (a==='up'){ [L[i-1], L[i]] = [L[i], L[i-1]]; showSlide = i-1; }
    if (a==='down'){ [L[i+1], L[i]] = [L[i], L[i+1]]; showSlide = i+1; }
    if (a==='del'){ L.splice(i,1); showSlide = Math.min(showSlide, L.length-1); }
    if (a==='add'){ L.push(JSON.parse(JSON.stringify(f.blank))); showSlide = L.length-1; }
    if (a==='orig'){ setPath(k, JSON.parse(JSON.stringify(f.orig))); showSlide = 0; }
    refreshLists(); render(); save(); return;
  }
  if (b.dataset.v){ set(b.dataset.k, b.dataset.v); render(); sync(); save(); return; }
  if (b.dataset.default){ set(b.dataset.default, FIELD[b.dataset.default].def); render(); sync(); save(); return; }
  const act = b.dataset.act; if (!act) return;
  if (act.startsWith('dn-')){
    const L = S.slides, i = +b.closest('.slide')?.dataset.i;
    if (act==='dn-show'){ showSlide = i; if (moving) setMoving(false); else render(); $('dnslides').innerHTML = dnSlidesHTML(); return; }
    if (act==='dn-up'){ [L[i-1], L[i]] = [L[i], L[i-1]]; showSlide = i-1; }
    if (act==='dn-down'){ [L[i+1], L[i]] = [L[i], L[i+1]]; showSlide = i+1; }
    if (act==='dn-del'){ L.splice(i,1); showSlide = Math.min(showSlide, L.length-1); }
    if (act==='dn-add'){ L.push({video:'', poster:PH('dark', `VIDEO 0${L.length+1}`, 1920, 1080), filter:false, title:'New Slide\nTitle', desc:'설명 문구를 입력하세요'}); showSlide = L.length-1; }
    if (act==='dn-orig'){ S.slides = JSON.parse(JSON.stringify(FIELD['slides'].orig)); showSlide = 0; }
    if (act==='dn-noposter'){ L[i].poster = ''; }
    $('dnslides').innerHTML = dnSlidesHTML(); render(); save(); return;
  }
  const sl = S.pot.slides, i = +b.closest('.slide')?.dataset.i;
  if (act==='show'){ showSlide = i; if (moving) setMoving(false); else render(); $('slides').innerHTML = slidesHTML(); return; }
  if (act==='up'){ [sl[i-1], sl[i]] = [sl[i], sl[i-1]]; showSlide = i-1; }
  if (act==='down'){ [sl[i+1], sl[i]] = [sl[i], sl[i+1]]; showSlide = i+1; }
  if (act==='del'){ sl.splice(i,1); showSlide = Math.min(showSlide, sl.length-1); }
  if (act==='slide-url'){ sl.push({src:''}); showSlide = sl.length-1; }
  if (act==='slide-orig'){ S.pot.slides = FIELD['pot.slides'].orig.map(src=>({src})); showSlide = 0; }
  $('slides').innerHTML = slidesHTML(); render(); save();
  if (act==='slide-url') $('slides').querySelector(`[data-i="${showSlide}"] [data-slide-url]`)?.focus();
});
rail.addEventListener('change', async e => {
  const el = e.target;
  if (el.type!=='file' || !el.files.length) return;
  try {
    if (el.dataset.file){ set(el.dataset.file, await readImage(el.files[0])); }
    else if (el.dataset.slideFile!==undefined){ const i = +el.closest('.slide').dataset.i; S.pot.slides[i].src = await readImage(el.files[0]); showSlide = i; }
    else if (el.dataset.lfile){ const card = el.closest('[data-lk]'), i = +card.dataset.i; getRaw(card.dataset.lk)[i][el.dataset.lfile] = await readImage(el.files[0]); showSlide = i; refreshLists(); }
    else if (el.dataset.dnFile!==undefined){ const i = +el.closest('.slide').dataset.i; S.slides[i].poster = await readImage(el.files[0]); showSlide = i; if ($('dnslides')) $('dnslides').innerHTML = dnSlidesHTML(); }
    else if (el.dataset.slideAdd!==undefined){ for (const f of el.files) S.pot.slides.push({src: await readImage(f)}); showSlide = S.pot.slides.length-1; }
    if ($('slides')) $('slides').innerHTML = slidesHTML();
    render(); sync(); save(); toast('이미지를 넣었어요');
  } catch(err){ toast('이 파일은 읽을 수 없어요. JPG·PNG·WEBP 파일을 써주세요.'); }
  el.value = '';
});
function readImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => {
      if (/svg|gif/.test(file.type)) return res(fr.result);
      const img = new Image(); img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, 2000/Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL('image/webp', .86);
        if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
        res(out.length < fr.result.length ? out : fr.result);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ================= top bar ================= */
$('dev').onchange = e => { [devW, devH] = e.target.value.split('x').map(Number); sync(); render(); };
function setMoving(on){
  moving = on;
  $('mv-on').setAttribute('aria-pressed', String(on)); $('mv-off').setAttribute('aria-pressed', String(!on));
  render();
}
$('mv-on').onclick = () => { showSlide = 0; setMoving(true); };
$('mv-off').onclick = () => setMoving(false);
$('play').onclick = () => { showSlide = 0; moving = true; $('mv-on').setAttribute('aria-pressed','true'); $('mv-off').setAttribute('aria-pressed','false'); doc.getElementById('mount').innerHTML=''; requestAnimationFrame(render); };

const resetWrap = $('reset-wrap');
function resetIdle(){ resetWrap.innerHTML = '<button class="btn ghost" id="reset">기본값으로 초기화</button>'; $('reset').onclick = resetAsk; }
function resetAsk(){
  const what = store.cur < 0 ? '페이지 설정' : `${String(store.cur+1).padStart(2,'0')} ${T.title} 섹션`;
  resetWrap.innerHTML = `<small>${what}을 기본값으로?</small><button class="btn" id="r-yes">초기화</button><button class="btn ghost" id="r-no">취소</button>`;
  $('r-yes').onclick = () => {
    if (store.cur < 0) store.page = PAGE.defaults();
    else { const id = S.id; store.sections[store.cur].s = T.defaults(); store.sections[store.cur].s.id = id; }
    useSection(store.cur); showSlide = 0; buildRail(); buildOutline(); render(); save(); resetIdle(); toast('기본값으로 돌렸어요');
  };
  $('r-no').onclick = resetIdle;
}
$('reset').onclick = resetAsk;

/* ================= export modal ================= */
const hasUpload = o => /data:image\/(?!svg)/.test(JSON.stringify(o));
const HOSTS = [];
let tab = 'page';
function showTab(t){
  tab = t;
  ['page','sec','json'].forEach(k => $('tab-'+k).setAttribute('aria-pressed', String(k===t)));
  $('tab-sec').disabled = store.cur < 0;
  const out = $('m-out');
  let code = '', steps = '', warnObj = null;
  if (t === 'page'){
    code = buildPage(); warnObj = store.sections;
    steps = `<ol><li>아래 HTML 전체를 복사합니다.</li><li>메모장이나 코드 편집기에 붙여넣고 <b>index.html</b>로 저장합니다.</li><li>브라우저로 열면 바로 보이고, 그대로 웹 호스팅(GitHub Pages 등)에 올리면 공개 페이지가 됩니다.</li></ol>`;
    $('m-meta').textContent = `${(new Blob([code]).size/1024).toFixed(1)} KB · 섹션 ${store.sections.length}개`;
  } else if (t === 'sec'){
    code = buildExport(S); warnObj = S;
    steps = `<div class="hint">${String(store.cur+1).padStart(2,'0')} ${T.title} 섹션 하나만의 코드예요. 이미 있는 HTML 페이지의 &lt;body&gt; 안 원하는 위치에 붙여넣으면 됩니다.</div>`;
    $('m-meta').textContent = `${(new Blob([code]).size/1024).toFixed(1)} KB · 위젯 ID hw-${S.id}`;
  } else {
    code = JSON.stringify({format:'page-builder', version:1, page:store.page, sections:store.sections}, null, 2);
    steps = '<div class="hint">페이지 전체 설정이에요. 보관해 두었다가 이 칸에 붙여넣고 <b>이 설정 적용</b>을 누르면 그대로 복원되고, 다른 컴퓨터로 옮길 때도 써요.</div>';
    $('m-meta').textContent = 'JSON';
  }
  if (warnObj){
    HOSTS.forEach(([h, msg]) => { if (code.includes(h)) steps += `<div class="warn">${msg}</div>`; });
    if (hasUpload(warnObj)) steps += '<div class="warn">업로드한 이미지가 코드 안에 직접 들어 있어 코드가 큽니다. 가능하면 이미지 주소로 바꿔주세요.</div>';
  }
  out.value = code; out.readOnly = t !== 'json';
  $('m-steps').innerHTML = steps;
  $('m-apply').hidden = t !== 'json';
  out.scrollTop = 0;
}
$('export').onclick = () => { $('modal').hidden = false; showTab('page'); $('m-copy').focus(); };
$('tab-page').onclick = () => showTab('page');
$('tab-sec').onclick = () => showTab('sec');
$('tab-json').onclick = () => showTab('json');
$('m-close').onclick = () => { $('modal').hidden = true; $('export').focus(); };
$('modal').addEventListener('click', e => { if (e.target.id==='modal') $('m-close').click(); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('modal').hidden) $('m-close').click(); });
$('m-copy').onclick = () => {
  const out = $('m-out');
  const fallback = () => { out.focus(); out.select(); toast('선택해 두었어요. Ctrl/⌘+C로 복사하세요.'); };
  try { navigator.clipboard.writeText(out.value).then(()=>toast('복사했어요'), fallback); } catch(e){ fallback(); }
};
$('m-apply').onclick = () => {
  try {
    const obj = JSON.parse($('m-out').value);
    if (Array.isArray(obj.sections)){
      store.page = merge(PAGE.defaults(), obj.page || {});
      store.sections = obj.sections.filter(x => TPL[x.type]).map(x => ({type:x.type, s:merge(TPL[x.type].defaults(), x.s || {})}));
      store.cur = store.sections.length ? 0 : -1;
    } else if (obj.template && TPL[obj.template]){
      store.sections.push({type:obj.template, s:merge(TPL[obj.template].defaults(), obj.settings || {})});
      store.cur = store.sections.length - 1;
    } else throw 0;
    switchSection(store.cur, {render:true}); save();
    $('modal').hidden = true; toast('설정을 적용했어요');
  } catch(e){ toast('JSON 형식이 올바르지 않아요. 내보낸 설정 전체를 붙여넣어 주세요.'); }
};
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden = true, 2400); }

/* ================= boot ================= */
$('undo').onclick = undo; $('redo').onclick = redo;
lastSnap = snap(); updateUndoUI();
buildOutline();
buildRail();
fit();
})();
