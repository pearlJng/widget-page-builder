<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Widget Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: top bar · widget gallery (cards) · single-widget editor (preview card + white settings panel). Blue/gray admin style. */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --line:#E5E8EC; --line-2:#EEF0F3; --hover:#F2F4F7;
  --fg:#1F2329; --fg-2:#4E5968; --muted:#8B95A1;
  --accent:#1E6BF0; --accent-weak:#EAF1FE; --accent-fg:#FFFFFF;
  --chip:#F2F4F6; --chip-fg:#4E5968;
  --danger:#E5484D; --danger-weak:#FDEDED; --success:#12A150; --success-weak:#E6F6EC;
  --warn:#9A5B00; --warn-bg:#FFF4E0; --stage:#EEF0F4; --sel:#FF5A36;
  --ui:'Pretendard UI','Pretendard Variable','Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --side:240px; --rail:360px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#171A21; --line:#272B34; --line-2:#20242C; --hover:#1E222A;
  --fg:#E7E9EE; --fg-2:#B4BAC6; --muted:#7E8696;
  --accent:#4C8DFF; --accent-weak:#18253D; --accent-fg:#FFFFFF;
  --chip:#22262F; --chip-fg:#B4BAC6;
  --danger:#FF6B6F; --danger-weak:#3A1D1F; --success:#3CCB7F; --success-weak:#15301F;
  --warn:#F2B54A; --warn-bg:#2B2210; --stage:#0B0D11; --sel:#FF7A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#171A21; --line:#272B34; --line-2:#20242C; --hover:#1E222A;
  --fg:#E7E9EE; --fg-2:#B4BAC6; --muted:#7E8696;
  --accent:#4C8DFF; --accent-weak:#18253D; --accent-fg:#FFFFFF;
  --chip:#22262F; --chip-fg:#B4BAC6;
  --danger:#FF6B6F; --danger-weak:#3A1D1F; --success:#3CCB7F; --success-weak:#15301F;
  --warn:#F2B54A; --warn-bg:#2B2210; --stage:#0B0D11; --sel:#FF7A5C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;min-height:0}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:28px;height:52px;padding:0 20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.top-status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.top-status i{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none}
@media (max-width:760px){.topbar{gap:12px}.top-status span{display:none}}

.logo{font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.logo span{color:var(--accent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--fg-2);flex:none}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.icon-btn:disabled{opacity:.35;cursor:default}
/* right-click menu */
.ctx{position:fixed;z-index:80;min-width:184px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.16);display:grid;gap:1px}
.ctx button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--fg);font-size:13.5px;text-align:left;white-space:nowrap}
.ctx button svg.ic{width:16px;height:16px;color:var(--fg-2)}
.ctx button:hover:not(:disabled),.ctx button:focus-visible{background:var(--hover);outline:none}
.ctx button:disabled{opacity:.4;cursor:default}
.ctx button.danger,.ctx button.danger svg.ic{color:var(--danger)}
.ctx button.danger:hover,.ctx button.danger:focus-visible{background:var(--danger-weak)}
.ctx kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ctx hr{border:0;border-top:1px solid var(--line-2);margin:4px 2px}
.ctx-head{padding:6px 10px 4px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
/* confirm */
.sheet.cf-sheet{width:min(420px,100%);grid-template-rows:auto 1fr auto}
.sheet.cf-sheet header{padding-top:20px}
.cf-body{padding:10px 20px 0;word-break:keep-all;font-size:13.5px;color:var(--fg-2);line-height:1.6}
.cf-body strong{color:var(--fg);font-weight:600}
.cf-body small{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
.sheet.cf-sheet footer{justify-content:flex-end}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-fill:hover{filter:brightness(.94)}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 28px 14px;padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.title-row{display:flex;align-items:baseline;gap:10px;margin-top:4px;flex-wrap:wrap}
.title-row h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.title-row span{font-size:13px;color:var(--muted)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vsep{width:1px;height:22px;background:var(--line)}
.tabs{display:inline-flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 12px 9px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs button small{font-weight:600;color:var(--accent);margin-left:3px}
.tabs button[aria-pressed="false"] small{color:var(--muted)}
.tabs button:disabled{opacity:.4;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 14px;font-size:13.5px;font-weight:500;color:var(--fg);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.outline{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn svg.ic{width:16px;height:16px}
.icon-group{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.icon-group .icon-btn{border-radius:0;width:36px;height:34px}
.icon-group .icon-btn + .icon-btn{border-left:1px solid var(--line)}
.dev-switch{display:inline-flex;align-items:center;gap:8px}
.dev-group .icon-btn[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent)}
.dev-label{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:64px;white-space:nowrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);cursor:pointer;white-space:nowrap;user-select:none}
.reset-wrap{display:inline-flex;gap:6px;align-items:center}
.reset-wrap small{color:var(--muted)}

.body{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);min-height:0}
.stage{position:relative;overflow:auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 28px}
.holder{position:relative;flex:none;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
.holder.phone{border-radius:16px}
#view{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff;display:block}
.stage-meta{color:var(--muted);font-size:12px;text-align:center;line-height:1.7;max-width:900px}
.stage-meta b{color:var(--fg-2);font-weight:600}
.stage-meta kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}

/* ---------- settings panel ---------- */
.rail{background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.rail-head{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.rail-head small{display:block;font-size:12px;color:var(--muted)}
.rail-head b{display:block;font-size:16px;font-weight:700;margin-top:2px}
.rail-head .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;background:var(--chip);color:var(--chip-fg);font-size:11.5px;font-weight:500;white-space:nowrap}
.chip.blue{background:var(--accent-weak);color:var(--accent)}
.chip.green{background:var(--success-weak);color:var(--success)}
.rail details{margin:12px 14px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rail details:last-of-type{margin-bottom:16px}
.rail summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.rail summary::-webkit-details-marker{display:none}
.rail summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
.rail details[open] summary::after{transform:rotate(-135deg)}
.rail details[open] summary{border-bottom:1px solid var(--line-2)}
.rail details.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rail details.hot summary{color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.rail details.hot .dot{background:var(--accent)}
.fields{display:grid;padding:4px 14px 14px}
.fields > *{padding:12px 0 0}
.fields > .f + .f{border-top:1px solid var(--line-2);margin-top:12px}
.sub{font-size:11.5px;font-weight:600;color:var(--accent);margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);letter-spacing:.02em}
.f{display:grid;gap:7px;min-width:0}
.f > label,.f > .lab{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2);font-weight:500}
.f > .chip,.f .chip{height:20px;font-size:11px}
.orig{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500;background:var(--chip);border-radius:4px;padding:1px 6px}
.chip[data-chip]{background:var(--accent-weak);color:var(--accent);height:20px;font-size:11px;padding:0 6px;border:0}
.row{display:flex;gap:8px;align-items:center;min-width:0}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
input.num{width:72px;height:32px;text-align:right;font-family:var(--mono);font-size:12px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.unit{font-size:11.5px;color:var(--muted);min-width:24px}
input.txt,.rail select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;height:36px}
textarea{resize:vertical;min-height:72px;line-height:1.5;padding:8px 10px;height:auto}
input.txt:focus,.rail select:focus,textarea:focus,input.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[type=color]{width:36px;height:36px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--surface);flex:none;cursor:pointer}
.hex{font-family:var(--mono);font-size:12px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--fg);cursor:pointer}
.tog input,.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:#CDD2DA;position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.tog input::after,.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog input:checked,.switch input:checked{background:var(--accent)}
.tog input:checked::after,.switch input:checked::after{transform:translateX(16px)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.thumb{width:56px;height:56px;border-radius:6px;border:1px solid var(--line);object-fit:contain;flex:none;background:repeating-conic-gradient(var(--bg) 0 25%,var(--surface) 0 50%) 0 0/10px 10px}
.img-f{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start}
.img-actions{display:grid;gap:6px;min-width:0}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--fg-2)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);font-weight:600}
.seg.full{display:flex}
.seg.full button{flex:1}
.slides{display:grid;gap:8px}
.slide{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.slide.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slide .tb{border:0;padding:0;background:none;position:relative}
.slide .tb span{position:absolute;left:3px;top:3px;font-family:var(--mono);font-size:10px;background:var(--fg);color:var(--surface);border-radius:4px;padding:0 4px}
.slide .ctrls{display:grid;gap:6px;min-width:0}
.slide .row .btn{height:28px;padding:0 8px}
.slide.dn{grid-template-columns:minmax(0,1fr);gap:8px}
.dn-head{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dn-head b{font-size:12px;font-family:var(--mono);margin-right:auto;color:var(--fg-2)}
.dn-head .btn{height:28px;padding:0 8px;font-size:12px}
.slide.dn label.mini{font-size:12px;color:var(--fg-2);display:grid;gap:5px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(16,20,30,.45);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(880px,100%);max-height:100%;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden;box-shadow:0 24px 64px rgba(16,24,40,.18)}
.sheet header{display:flex;align-items:center;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.sheet header b{font-size:17px;font-weight:700;margin-right:auto}
.sheet .tabs{width:100%}
.sheet .steps{padding:14px 20px 0;display:grid;gap:8px;font-size:13px;color:var(--fg-2)}
.sheet .steps ol{margin:0;padding-left:20px;display:grid;gap:2px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:9px 12px;font-size:12.5px}
.sheet textarea{font-family:var(--mono);font-size:11.5px;margin:12px 20px 0;width:auto;min-height:260px;resize:none;white-space:pre;overflow:auto;background:var(--bg)}
.sheet footer{display:flex;align-items:center;gap:8px;padding:14px 20px;flex-wrap:wrap;border-top:1px solid var(--line-2);margin-top:14px}
.sheet footer .meta{margin-right:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:240px;margin-bottom:8px;color:var(--muted)}
.search input{border:0;outline:none;background:transparent;width:100%;height:100%;color:var(--fg)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.img-sheet{width:min(560px,100%);grid-template-rows:auto 1fr auto}
.img-sheet header{padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.img-body{padding:16px 20px;display:grid;gap:16px;overflow:auto}
.img-item{display:grid;gap:8px}
.img-item > b{font-size:13px}
.img-prev{width:100%;max-height:240px;aspect-ratio:16/9;object-fit:contain;border:1px solid var(--line);border-radius:var(--r);background:repeating-conic-gradient(var(--bg) 0 25%,var(--surface) 0 50%) 0 0/14px 14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1F2329;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* ---------- widget gallery ---------- */
.w-only{display:none}
.app.mode-widget .w-only{display:inline-flex}
.app.mode-gallery .page-head .actions,.app.mode-gallery .body{display:none}
.crumb-back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:2px 6px 2px 2px;margin-left:-2px;border-radius:4px;font-size:12px;font-weight:600;color:var(--accent)}
.crumb-back:hover{background:var(--accent-weak)}
.crumb-back svg.ic{width:14px;height:14px}
.title-row .t-edit{width:28px;height:28px;align-self:center}
.title-row .t-edit svg.ic{width:15px;height:15px}
.gallery{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;background:var(--bg)}
.g-tools{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 28px 0;background:transparent;border-bottom:1px solid var(--line)}
.g-tools .tabs{border-bottom:0;overflow-x:auto;overflow-y:hidden;max-width:100%;scrollbar-width:none}
.g-tools .tabs::-webkit-scrollbar{display:none}
.g-body{overflow:auto;padding:22px 28px 40px;display:grid;align-content:start;gap:26px}
.g-intro{font-size:13px;color:var(--fg-2);line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.g-intro b{color:var(--fg);font-weight:600}
.g-group h3{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.g-group h3 small{font-size:12px;color:var(--accent);font-weight:600}
.g-sub{margin-bottom:18px}
.g-sub h4{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.g-card{display:grid;grid-template-rows:auto 1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.g-card:hover{border-color:#C9D3E3;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.g-card.mine{border-color:var(--accent-weak);box-shadow:inset 0 3px 0 var(--accent)}
.g-thumb{position:relative;display:block;width:100%;aspect-ratio:16/10;padding:0;border:0;border-bottom:1px solid var(--line-2);background:repeating-linear-gradient(45deg,var(--bg) 0 10px,var(--surface) 10px 20px);overflow:hidden;cursor:pointer}
.g-thumb iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none;background:transparent}
.g-thumb::after{content:"편집하기";position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,24,40,.42);color:#fff;font-size:14px;font-weight:600;opacity:0;transition:opacity .15s}
.g-thumb:hover::after,.g-thumb:focus-visible::after{opacity:1}
.g-badge{position:absolute;left:10px;top:10px;z-index:1;height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:4px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:600}
.g-info{padding:12px 14px 4px;display:grid;gap:3px;align-content:start;min-width:0}
.g-info small{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.g-info b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-info p{margin:0;font-size:12.5px;color:var(--fg-2);line-height:1.5}
.g-acts{display:flex;align-items:center;gap:6px;padding:10px 14px 14px}
.g-acts .icon-btn{margin-left:auto;width:30px;height:30px}
.g-empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7;background:var(--surface)}
.cf-input{display:block;width:100%;box-sizing:border-box;margin-top:12px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px}
.cf-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
@media (max-width:760px){.g-tools,.g-body{padding-left:16px;padding-right:16px}.g-grid{grid-template-columns:1fr}}

/* ---------- device preview ---------- */
.pv{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:auto minmax(0,1fr);background:#E9ECF1}
.pv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pv-bar b{font-size:15px;font-weight:700;margin-right:6px}
.pv-hint{font-size:12px;color:var(--muted);margin-right:auto}
.pv-stage{position:relative;overflow:auto;display:grid;place-items:center;padding:24px}
.pv-frame{position:relative;overflow:hidden;background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(16,24,40,.08),0 24px 60px rgba(16,24,40,.18)}
.pv-frame.phone{border-radius:26px;outline:8px solid #1F2329}
.pv-frame.tablet{border-radius:18px;outline:8px solid #1F2329}
#pv-view{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff;display:block}
@media (max-width:760px){.pv-hint{display:none}}

/* ---------- responsive ---------- */
@media (max-width:1280px){:root{--rail:320px}.page-head{padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}.stage{padding:20px}}
@media (max-width:1024px){
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  .body{grid-template-columns:minmax(0,1fr)}
  .rail{border-left:0;border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px)}
  .stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page-head{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

${C} .hw-show{position:relative;overflow:hidden}
${C} .hw-bg{position:absolute;inset:0;width:100%;height:100%;max-width:none;margin:0;object-fit:cover;object-position:${st.right.px}% ${st.right.py}%}
${C} .hw-dim{position:absolute;inset:0;background:rgba(0,0,0,${st.right.dim/100})}
${C} .hw-content{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:${H.pad}px;text-align:${H.align}}
${C} .hw-h{margin:0;${txt(H)}-webkit-text-stroke:${H.sw}px ${H.stroke};${H.shx||H.shy?`text-shadow:${H.shx}px ${H.shy}px 0 ${H.sh};`:''}${tr(H,'d')}}
${C} .hw-line{display:inline-block}
${C} .hw-cursor{display:inline-block;animation:hwBlink-${id} ${st.type.blink}s step-end infinite}
@keyframes hwBlink-${id}{0%,100%{opacity:1}50%{opacity:0}}`;
    [['top',T,-1],['bottom',B,1]].forEach(([cls,t,sign]) => {

@keyframes hwIn-${cls}-${id}{from{opacity:0;transform:translateX(${sign*t.dist}px)}to{opacity:1;transform:translateX(0)}}

    const cursor = st.type.on && st.type.cursor ? `<span class="hw-cursor" aria-hidden="true">${esc(st.type.cchar)}</span>` : '';
    const src = s => preview ? pv(s) : s;
    return `<section class="hw-hero hw-${st.id}">

    </div>
    <span class="hw-st bottom"${a('bottom')}${ed('bottom.text')}>${esc(st.bottom.text)}</span>
  </div>

${st.right.dim ? '    <div class="hw-dim"></div>\n' : ''}    <div class="hw-content">
      <${tag} class="hw-h" aria-label="${esc(lines.join(' '))}"${a('head')}${ed('head.lines')}>${lineHTML}${cursor}</${tag}>
    </div>
  </div>
</section>`;
  }

  // same logic as the original script.js (pot rotation + typewriter)
  function run(root, o){
    var timers = [], iv = null;
    var slides = root.querySelectorAll('.hw-slide');
    if (o.auto && slides.length > 1){
      var cur = 0;
      for (var i=0;i<slides.length;i++) if (slides[i].classList.contains('is-active')) cur = i;
      iv = setInterval(function(){
        slides[cur].classList.remove('is-active');
        cur = (cur + 1) % slides.length;
        slides[cur].classList.add('is-active');
      }, o.interval);
    }
    var h = root.querySelector('.hw-h');
    if (h && o.type){
      var lines = h.querySelectorAll('.hw-line'), cursor = h.querySelector('.hw-cursor');
      for (var j=0;j<lines.length;j++) lines[j].textContent = '';
      var li = 0, ci = 0;
      var next = function(){
        if (li >= lines.length) return;
        var line = lines[li], text = line.getAttribute('data-text') || '';
        if (ci <= text.length){
          line.textContent = text.slice(0, ci);
          if (cursor) line.parentNode.insertBefore(cursor, line.nextSibling);
          ci++; timers.push(setTimeout(next, o.speed));
        } else { li++; ci = 0; timers.push(setTimeout(next, o.pause)); }
      };
      timers.push(setTimeout(next, o.start));
    }
    return function(){ clearInterval(iv); for (var k=0;k<timers.length;k++) clearTimeout(timers[k]); };
  }
  const cfg = st => ({auto:st.pot.auto, interval:st.pot.interval, type:st.type.on, speed:st.type.speed, pause:st.type.pause, start:st.type.start});

  };

@media (max-width:1000px){${C} .dn-flex{flex-direction:column;align-items:flex-end}${C} .dn-left{width:100%;flex:unset;margin-bottom:20px}}

    return c;
  }

  function html(st, {preview=false, slide=0}={}){
    const a = k => preview ? ` data-el="${k}"` : '';
    const ed = p => preview ? ` data-edit="${p}"` : '';
    const sl = st.slides, n = sl.length, on = Math.min(slide, n-1), U = st.ui;
    const src = s => preview ? pv(s) : s;
    const slides = sl.map((s,i) => {
      const poster = s.poster ? ` poster="${esc(src(s.poster))}"` : '';
      const ph = preview ? `<div class="dn-ph">${s.poster ? '' : `VIDEO ${pad2(i+1)}<br>${esc((s.video||'영상 주소 없음').split('/').pop())}<br>미리보기에서는 재생되지 않아요`}</div>` + (s.poster ? `<img class="dn-poster" src="${esc(src(s.poster))}" alt="">` : '') : '';
      return `    <div class="dn-slide${s.filter?' dn-filter':''}${i===on?' is-on':''}"${preview?` data-img="slides.${i}.video|slides.${i}.poster"`:''}>${ph}${s.video ? `<video loop playsinline muted autoplay preload="metadata"${poster}><source src="${esc(s.video)}" type="video/mp4"></video>` : (!preview && s.poster ? `<img class="dn-poster" src="${esc(src(s.poster))}" alt="">` : '')}</div>`;
    }).join('\n');
    const txts = sl.map((s,i) => `<div class="dn-txt${i===on?' is-on':''}"><h2${a('title')}${ed('slides.'+i+'.title')}>${esc(s.title)}</h2><p${a('desc')}${ed('slides.'+i+'.desc')}>${descHTML(s.desc)}</p></div>`).join('');
    const info = U.info ? `<div class="dn-info"${a('info')}><button class="dn-prev" type="button" aria-label="이전 슬라이드"><i></i></button><span class="dn-idx">${pad2(on+1)}</span><div class="dn-line"><i style="width:calc((100% / ${n}) * ${on+1})"></i></div><span class="dn-len">${pad2(n)}</span><button class="dn-next" type="button" aria-label="다음 슬라이드"><i></i></button></div>` : '';
    const scroll = U.scroll ? `<div class="dn-right"><div class="dn-scroll"${a('scroll')}><div class="dn-circle"><i></i></div><div class="dn-scroll-text"${ed('ui.scrollText')}>${esc(U.scrollText)}</div></div></div>` : '';
    return `<section class="hw-hero hw-${st.id}"${a('section')}>
  <div class="dn-slides">
${slides}
  </div>
  <div class="dn-cover"${a('cover')}>
    <div class="dn-box"><div class="dn-flex">
      <div class="dn-left">${info}<div class="dn-txts">${txts}</div></div>
      ${scroll}
    </div></div>
${U.bar ? `    <div class="dn-bar"${a('bar')}><i></i></div>\n` : ''}  </div>
</section>`;
  }

  // same flow as the original main.js: fade slides, play the active video, fill the bar for the video's length
  function run(root, o){
    var slides = root.querySelectorAll('.dn-slide'), txts = root.querySelectorAll('.dn-txt'), n = slides.length;
    var bar = root.querySelector('.dn-bar i'), line = root.querySelector('.dn-line i'), idxEl = root.querySelector('.dn-idx');
    var idx = 0, timer = null, endTimer = null, token = 0, dead = false;
    if (!n) return function(){};
    for (var s=0;s<n;s++) if (slides[s].classList.contains('is-on')) idx = s;
    var pad = function(x){ return x <= 9 ? '0'+x : ''+x; };
    var vid = function(i){ return slides[i] ? slides[i].querySelector('video') : null; };
    var play = function(i){
      for (var j=0;j<n;j++){ var w = vid(j); if (w && j !== i) w.pause(); }
      var v = vid(i); if (!v) return;
      try { v.currentTime = 0; } catch(e){}
      var p = v.play(); if (p && p.catch) p.catch(function(){});
    };
    var fill = function(ms){
      ms = Math.max(ms || o.auto, 1000);
      clearTimeout(timer);
      if (bar){ bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth; bar.style.transition = 'width ' + ms + 'ms linear'; bar.style.width = '100%'; }
      timer = setTimeout(function(){ show(idx + 1); }, ms);
    };
    var length = function(i){
      var v = vid(i);
      if (!o.useVideo || !v) return o.auto;
      return (isFinite(v.duration) && v.duration > 0) ? Math.max(Math.round((v.duration - v.currentTime) * 1000), 1000) : null;
    };
    var sync = function(i){
      var t = ++token, d = length(i), v = vid(i);
      if (d){ fill(d); return; }
      clearTimeout(timer);
      if (bar){ bar.style.transition = 'none'; bar.style.width = '0'; }
      var start = function(){ if (dead || t !== token || idx !== i) return; fill(length(i) || o.auto); };
      v.addEventListener('playing', start, {once:true});
      v.addEventListener('loadedmetadata', start, {once:true});
      setTimeout(start, 350);
    };
    var text = function(i){
      for (var k=0;k<txts.length;k++){ txts[k].classList.remove('is-anim'); txts[k].classList.toggle('is-on', k === i); }
      requestAnimationFrame(function(){ if (txts[i]) txts[i].classList.add('is-anim'); });
    };
    var show = function(i, first){
      i = (i % n + n) % n;
      idx = i; token++;
      clearTimeout(timer); clearTimeout(endTimer);
      for (var k=0;k<n;k++) slides[k].classList.toggle('is-on', k === i);
      if (bar){ bar.style.transition = 'none'; bar.style.width = '0'; }
      if (line) line.style.width = 'calc((100% / ' + n + ') * ' + (i + 1) + ')';
      if (idxEl) idxEl.textContent = pad(i + 1);
      text(i);
      if (first){ play(i); sync(i); return; }
      endTimer = setTimeout(function(){ if (dead || idx !== i) return; play(i); sync(i); }, o.speed);
    };
    var prev = root.querySelector('.dn-prev'), next = root.querySelector('.dn-next');
    var onPrev = function(){ show(idx - 1); }, onNext = function(){ show(idx + 1); };
    if (prev) prev.addEventListener('click', onPrev);
    if (next) next.addEventListener('click', onNext);
    show(idx, true);
    return function(){
      dead = true; clearTimeout(timer); clearTimeout(endTimer);
      if (prev) prev.removeEventListener('click', onPrev);
      if (next) next.removeEventListener('click', onNext);
      for (var j=0;j<n;j++){ var w = vid(j); if (w) w.pause(); }
    };
  }
  const cfg = st => ({speed:st.play.speed, auto:st.play.auto, useVideo:st.play.useVideo});

  };

  function html(st, {preview=false}={}){
    const a = k => preview ? ` data-el="${k}"` : '', ed = p => preview ? ` data-edit="${p}"` : '';
    const src = s => preview ? pv(s) : s;
    const cards = st.cards.map((c,i) => {
      const poster = c.poster || (preview ? POSTER[c.video] : '');
      const art = c.video
        ? `<video class="cc-art" src="${esc(src(c.video))}"${poster ? ` poster="${esc(src(poster))}"` : ''} autoplay muted loop playsinline preload="auto" aria-hidden="true" data-rate="${c.rate}"></video>`
        : (c.poster ? `<img class="cc-art" src="${esc(src(c.poster))}" alt="" aria-hidden="true">` : '');
      const tags = c.tags.split('\n').map(t => t.trim()).filter(Boolean).map(t => `<li>${esc(t)}</li>`).join('');
      return `<a class="cc-card" href="${esc(c.href)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(c.hover || c.title)}"${preview ? ` data-img="cards.${i}.video|cards.${i}.poster"` : ''}>
        ${art}
        <h3${ed('cards.'+i+'.title')}>${esc(c.title)}</h3>
        <p class="cc-desc"${ed('cards.'+i+'.desc')}>${nl(c.desc)}</p>
        <ul class="cc-tags">${tags}</ul>
        <span class="cc-hover"><span class="cc-flair"></span><span class="cc-hover-text">${esc(c.hover)}</span>${ARROW(c.accent)}</span>
      </a>`;
    }).join('\n      ');
    return `<section class="hw-hero hw-${st.id}"${a('section')}>
  <div class="cc-bg" aria-hidden="true"></div>
  <div class="cc-result">
    <h2 class="cc-title"${a('title')}${ed('title.lines')}>${esc(st.title.lines)}</h2>
    <div class="cc-cards">
      ${cards}
    </div>
  </div>
</section>`;
  }

  // ported from plan-et main.js: card reveal (squash & stretch), Matter.js capsule drop with jelly springs, hover flair
  function run(root, o){
    var W = root.ownerDocument.defaultView, dead = false, cleanups = [], waitT = null;
    var videos = root.querySelectorAll('video[data-rate]');
    for (var v = 0; v < videos.length; v++){ (function(el){ var r = parseFloat(el.getAttribute('data-rate')) || 1; el.playbackRate = r; el.addEventListener('loadedmetadata', function(){ el.playbackRate = r; }); })(videos[v]); }
    function boot(){
      var gsap = W.gsap, Matter = W.Matter;
      if (!gsap){ if (Date.now() - t0 < 6000){ waitT = setTimeout(boot, 120); } return; }
      var reduced = W.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var title = root.querySelector('.cc-title');
      var cards = Array.prototype.slice.call(root.querySelectorAll('.cc-card'));
      var groups = Array.prototype.slice.call(root.querySelectorAll('.cc-tags'));
      var tags = Array.prototype.slice.call(root.querySelectorAll('.cc-tags li'));
      var canHover = o.hover && W.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 1025px)').matches;
      var runs = [];
      var JELLY = {stiffness:420, damping:9, wobbleStiffness:260, wobbleDamping:6.5, maxSquash:0.3, maxStretch:0.12, maxWobble:13};
      function capsuleText(el){ if (el.__ct) return el.__ct; var s = W.document.createElement('span'); while (el.firstChild) s.appendChild(el.firstChild); el.appendChild(s); gsap.set(s, {display:'inline-block'}); el.__ct = s; return s; }
      function createJelly(el){ return {text:capsuleText(el), s:0, sv:0, sideways:false, w:0, wv:0, prevSpin:0}; }
      function jellyHit(j, speed, sideways, tangent){ if (speed < 0.5) return; var imp = gsap.utils.clamp(0, 10, speed); if (Math.abs(j.s) < 0.04) j.sideways = sideways; j.sv -= imp * 0.62; j.wv += gsap.utils.clamp(-1, 1, tangent || 0) * imp * 34; }
      function jellyStep(j, body, dt){
        var fall = j.sideways ? 0 : gsap.utils.clamp(0, JELLY.maxStretch, body.velocity.y * 0.012);
        j.sv += (-JELLY.stiffness * (j.s - fall) - JELLY.damping * j.sv) * dt;
        j.s = gsap.utils.clamp(-JELLY.maxSquash, JELLY.maxStretch * 1.6, j.s + j.sv * dt);
        var spin = body.angularVelocity - j.prevSpin; j.prevSpin = body.angularVelocity; if (Math.abs(spin) < 0.004) spin = 0;
        j.wv += (-JELLY.wobbleStiffness * j.w - JELLY.wobbleDamping * j.wv) * dt - spin * 3200;
        j.w = gsap.utils.clamp(-JELLY.maxWobble, JELLY.maxWobble, j.w + j.wv * dt);
      }
      function jellyPose(j){ var press = 1 + j.s, bulge = 1 - j.s * 0.8, sx = j.sideways ? press : bulge, sy = j.sideways ? bulge : press; gsap.set(j.text, {scaleX:1/sx, scaleY:1/sy, skewX:-j.w}); return {scaleX:sx, scaleY:sy, skewX:j.w}; }

      function createTagDrop(container, delayOffset, opts){
        var stagger = opts.stagger || 115;
        container.classList.add('is-drop');
        var els = Array.prototype.slice.call(container.querySelectorAll('li'));
        var width = container.clientWidth, height = container.clientHeight, cTop = container.offsetTop;
        if (!els.length || width <= 0 || height <= 0 || !Matter){ container.classList.remove('is-drop'); gsap.set(els, {autoAlpha:1, scale:1, clearProps:'transform'}); return null; }
        var E = Matter.Engine, B = Matter.Bodies, Bd = Matter.Body, Cp = Matter.Composite;
        var engine = E.create({positionIterations:10, velocityIterations:8, constraintIterations:3});
        engine.gravity.y = opts.gravity || 1.18;
        var recs = els.map(function(el){
          var bw = el.offsetWidth, bh = el.offsetHeight;
          var x = bw / 2 + Math.random() * Math.max(1, width - bw), y = -cTop - bh / 2 - 20 - Math.random() * 42;
          var rest = (-7 + Math.random() * 14) * Math.PI / 180;
          var body = B.rectangle(x, y, bw, bh, {restitution:0.48, friction:0.28, frictionStatic:0.48, frictionAir:0.012, density:0.0014, chamfer:{radius:Math.min(20, bh / 2)}});
          Bd.setVelocity(body, {x:-3.5 + Math.random() * 7, y:0.8 + Math.random() * 2.4});
          Bd.setAngularVelocity(body, -0.025 + Math.random() * 0.05); Bd.setAngle(body, rest);
          return {el:el, w:bw, h:bh, body:body, rest:rest, jelly:createJelly(el), active:false};
        });
        var wallH = (cTop + height) * 2 + 800;
        var walls = [B.rectangle(width / 2, height + 25, width + 100, 50, {isStatic:true}), B.rectangle(-25, height / 2, 50, wallH, {isStatic:true}), B.rectangle(width + 25, height / 2, 50, wallH, {isStatic:true})];
        Cp.add(engine.world, walls);
        gsap.set(els, {scale:1, autoAlpha:0});
        var floor = walls[0];
        function recOf(b){ for (var i = 0; i < recs.length; i++) if (recs[i].body === b) return recs[i]; return null; }
        Matter.Events.on(engine, 'collisionStart', function(ev){
          ev.pairs.forEach(function(p){
            var a = recOf(p.bodyA), b = recOf(p.bodyB);
            if (p.bodyA === floor || p.bodyB === floor){ var c = a || b; if (!c) return; var tilt = Math.atan2(Math.sin(c.body.angle), Math.cos(c.body.angle)); jellyHit(c.jelly, c.body.velocity.y, false, tilt * 4 + c.body.velocity.x * 0.15); return; }
            if (!a || !b) return;
            var dvx = a.body.velocity.x - b.body.velocity.x, dvy = a.body.velocity.y - b.body.velocity.y, sp = Math.sqrt(dvx * dvx + dvy * dvy);
            if (sp < 0.8) return;
            var nrm = p.collision && p.collision.normal, side = nrm ? Math.abs(nrm.x) > Math.abs(nrm.y) : Math.abs(dvx) > Math.abs(dvy), tan = nrm ? (dvy * nrm.x - dvx * nrm.y) / sp : 0;
            jellyHit(a.jelly, sp * 0.5, side, tan); jellyHit(b.jelly, sp * 0.5, side, -tan);
          });
        });
        var MAX = 24, GAP = 700, lastKick = 0, started = W.performance.now(), prev = started;
        var run = {frame:0, timers:[], container:container, kick:null, stop:null};
        recs.slice().sort(function(){ return Math.random() - 0.5; }).forEach(function(r, i){
          run.timers.push(setTimeout(function(){
            r.active = true; Cp.add(engine.world, r.body);
            gsap.set(r.el, {x:r.body.position.x - r.w / 2, y:r.body.position.y - r.h / 2, rotation:r.body.angle * 180 / Math.PI, autoAlpha:1});
          }, i * stagger + (delayOffset || 0)));
        });
        function sim(now){
          var d = Math.min(now - prev, 33.333); prev = now;
          recs.forEach(function(r){ if (!r.active) return; var err = Math.atan2(Math.sin(r.body.angle - r.rest), Math.cos(r.body.angle - r.rest)); var spr = Math.abs(err) > 0.6 ? 0.016 : 0.0018; Bd.setAngularVelocity(r.body, r.body.angularVelocity * 0.978 - err * spr); });
          E.update(engine, d);
          recs.forEach(function(r){
            if (!r.active) return;
            var vv = r.body.velocity, sp = Math.sqrt(vv.x * vv.x + vv.y * vv.y);
            if (sp > MAX) Bd.setVelocity(r.body, {x:vv.x / sp * MAX, y:vv.y / sp * MAX});
            var half = r.w / 2, x = r.body.position.x;
            if (x < half || x > width - half){ Bd.setPosition(r.body, {x:gsap.utils.clamp(half, width - half, x), y:r.body.position.y}); Bd.setVelocity(r.body, {x:-r.body.velocity.x * 0.4, y:r.body.velocity.y}); }
            jellyStep(r.jelly, r.body, d / 1000);
            gsap.set(r.el, Object.assign(jellyPose(r.jelly), {x:r.body.position.x - r.w / 2, y:r.body.position.y - r.h / 2, rotation:r.body.angle * 180 / Math.PI}));
          });
          var el = now - started;
          var jig = recs.some(function(r){ var j = r.jelly; return Math.abs(j.s) + Math.abs(j.sv) * 0.02 > 0.004 || Math.abs(j.w) + Math.abs(j.wv) * 0.02 > 0.15; });
          if (el < 8000 || (jig && el < 11000)) run.frame = W.requestAnimationFrame(sim);
          else recs.forEach(function(r){ var j = r.jelly; j.s = j.sv = j.w = j.wv = 0; gsap.to(r.el, {scaleX:1, scaleY:1, skewX:0, duration:0.25, ease:'power2.out'}); gsap.to(j.text, {scaleX:1, scaleY:1, skewX:0, duration:0.25, ease:'power2.out'}); });
        }
        run.kick = function(){
          var now = W.performance.now(); if (now - lastKick < GAP) return; lastKick = now;
          recs.forEach(function(r){
            if (!r.active) return;
            Bd.setVelocity(r.body, {x:r.body.velocity.x + (-5.5 + Math.random() * 11), y:-4.8 - Math.random() * 3.7});
            Bd.setAngularVelocity(r.body, r.body.angularVelocity + (-0.09 + Math.random() * 0.18));
            gsap.killTweensOf([r.el, r.jelly.text], 'scaleX,scaleY,skewX'); jellyHit(r.jelly, 5, false, -1 + Math.random() * 2);
          });
          started = W.performance.now(); prev = started; W.cancelAnimationFrame(run.frame); run.frame = W.requestAnimationFrame(sim);
        };
        run.stop = function(){ W.cancelAnimationFrame(run.frame); run.timers.forEach(clearTimeout); Cp.clear(engine.world, false, true); E.clear(engine); };
        run.frame = W.requestAnimationFrame(sim);
        return run;
      }

      // hover flair
      cards.forEach(function(card){
        var flair = card.querySelector('.cc-flair'); if (!flair) return;
        gsap.set(flair, {scale:0, transformOrigin:'0 0'});
        if (!canHover) return;
        function xy(e){ var r = card.getBoundingClientRect(); var cx = e && typeof e.clientX === 'number' ? e.clientX : r.left + r.width / 2, cy = e && typeof e.clientY === 'number' ? e.clientY : r.top + r.height / 2; return {x:gsap.utils.clamp(0, 100, (cx - r.left) / r.width * 100), y:gsap.utils.clamp(0, 100, (cy - r.top) / r.height * 100)}; }
        function open(e){ if (!card.classList.contains('is-hover-ready')) return; var p = xy(e); gsap.set(flair, {xPercent:p.x, yPercent:p.y}); gsap.killTweensOf(flair); gsap.to(flair, {scale:1, duration:0.58, ease:'power3.out'}); }
        function move(e){ if (!card.classList.contains('is-hover-ready')) return; var p = xy(e); gsap.to(flair, {xPercent:p.x, yPercent:p.y, duration:0.42, ease:'power2.out', overwrite:'auto'}); }
        function close(e){
          if (!card.classList.contains('is-hover-ready')) return; var p = xy(e); gsap.killTweensOf(flair);
          gsap.to(flair, {xPercent:p.x > 90 ? p.x + 20 : (p.x < 10 ? p.x - 20 : p.x), yPercent:p.y > 90 ? p.y + 20 : (p.y < 10 ? p.y - 20 : p.y), scale:0, duration:0.4, ease:'power2.out'});
          var box = card.querySelector('.cc-tags'); runs.forEach(function(r){ if (r.container === box && r.kick) r.kick(); });
        }
        var en = function(e){ if (e.pointerType === 'mouse') open(e); }, mv = function(e){ if (e.pointerType === 'mouse') move(e); }, lv = function(e){ if (e.pointerType === 'mouse') close(e); };
        card.addEventListener('pointerenter', en); card.addEventListener('pointermove', mv); card.addEventListener('pointerleave', lv);
        cleanups.push(function(){ card.removeEventListener('pointerenter', en); card.removeEventListener('pointermove', mv); card.removeEventListener('pointerleave', lv); });
      });
      function ready(){ if (canHover) cards.forEach(function(c){ c.classList.add('is-hover-ready'); }); }
      function drop(){ if (dead) return; if (o.drop) groups.forEach(function(g, i){ var r = createTagDrop(g, i * 40, {stagger:70, gravity:o.gravity}); if (r) runs.push(r); }); else gsap.set(tags, {autoAlpha:1, scale:1}); timers.push(setTimeout(ready, 1000)); }
      var timers = [];
      if (reduced || !o.on){ gsap.set(tags, {autoAlpha:1}); if (o.drop && !reduced) timers.push(setTimeout(drop, 300)); else ready(); }
      else {
        gsap.set(title, {y:50, autoAlpha:0});
        gsap.set(cards, {y:90, scaleX:1.12, scaleY:0.6, autoAlpha:0, transformOrigin:'50% 100%'});
        gsap.set(tags, {scale:0.72, autoAlpha:0});
        var tl = gsap.timeline({paused:true})
          .to(title, {y:0, autoAlpha:1, duration:0.45, ease:'back.out(1.8)'})
          .to(cards, {autoAlpha:1, duration:0.15}, '<0.05')
          .to(cards, {keyframes:[{y:0, scaleX:0.95, scaleY:1.08, duration:0.22, ease:'power2.out'}, {scaleX:1.03, scaleY:0.96, duration:0.14, ease:'sine.inOut'}, {scaleX:1, scaleY:1, duration:0.3, ease:'back.out(2)'}]}, '<');
        var io = new W.IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ io.disconnect(); tl.play(); timers.push(setTimeout(drop, 800)); } }); }, {threshold:0.35});
        io.observe(root);
        cleanups.push(function(){ io.disconnect(); tl.kill(); });
      }
      cleanups.push(function(){ timers.forEach(clearTimeout); runs.forEach(function(r){ r.stop(); }); gsap.killTweensOf([title].concat(cards, tags)); });
    }
    var t0 = Date.now();
    boot();
    return function(){ dead = true; clearTimeout(waitT); cleanups.forEach(function(f){ f(); }); };
  }
  const cfg = st => ({on:st.anim.on, drop:st.anim.drop, gravity:st.anim.gravity, hover:st.anim.hover});

  return {
    key:'choice', cat:'content', no:'C03', title:'Choice Cards', sub:'제목 + 카드 2장, 떨어지는 태그 캡슐', source:'plan-et.co.kr',
    swatch:'linear-gradient(90deg,#000 0 8%,#161616 8% 47%,#000 47% 53%,#5F5F5F 53% 92%,#000 92%)',
    defaults, groups, fonts, css, html, run, cfg, libs:[LIB.gsap, LIB.matter],
    header:()=>0, bp:()=>767,
    drag:{title:['title.ox','title.oy',1,1]},
    selectGroup:{section:'cards', title:'title'},
    multiline:/^(title\.lines|cards\.\d+\.desc)$/,
    note:''
  };
})();

  }
  function html(st, {preview=false}={}){
    const a = k => preview ? ` data-el="${k}"` : '', ed = p => preview ? ` data-edit="${p}"` : '';
    const src = s => preview ? pv(s) : s;
    const L = st.logos.length ? st.logos : [];

    const one = (hidden) => Array.from({length:reps}).map(() => L.map((lg, i) => `<li><img src="${esc(src(lg.img))}" alt="${hidden ? '' : esc(lg.alt)}" decoding="async"${preview ? ` data-img="logos.${i}.img"` : ''}></li>`).join('')).join('');

    return `<section class="hw-hero hw-${st.id}"${a('section')}>
  <div class="lg-head">
    <h2 class="lg-title rv"${a('title')}${ed('title.text')}>${rich(st.title.text)}</h2>

    <div class="lg-mask"><div class="lg-track">
      <ul class="lg-list">${one(false)}</ul><ul class="lg-list" aria-hidden="true">${one(true)}</ul>
    </div></div>
  </div>
${st.cta.show ? `  <div class="lg-cta-row rv" style="--ry:16px"><a class="lg-cta" href="${esc(st.cta.href)}">${layer('')}<span class="lg-fill lg-wipe" aria-hidden="true"></span>${layer('lg-wipe lg-top')}</a></div>\n` : ''}</section>`;
  }
  // constant speed whatever the number of logos, plus the same 1.6s reveal as the original
  function run(root, o){
    var W = root.ownerDocument.defaultView, io = null;
    var track = root.querySelector('.lg-track');
    function speed(){ if (!track) return; var half = track.scrollWidth / 2; if (half > 0) track.style.animationDuration = Math.max(5, half / (o.speed || 67)) + 's'; }
    speed();
    var imgs = Array.prototype.slice.call(root.querySelectorAll('.lg-list img'));
    imgs.forEach(function(im){ if (!im.complete) im.addEventListener('load', speed, {once:true}); });
    W.addEventListener('resize', speed);

  }
  const cfg = st => ({speed:st.track.speed, reveal:true});
  return {
    key:'logos', cat:'content', group:'partners', no:'C08', title:'Logo Marquee', sub:'흐르는 파트너 로고 줄 + 채워지는 버튼 (다크)',

  };
})();

    var raf = 0, offs = [];
    function frame(){
      raf = 0; var busy = false;
      cards.forEach(function(c, i){
        var q = st[i], k = o.ease;
        q.rx += (q.tx - q.rx) * k; q.ry += (q.ty - q.ry) * k; q.s += (q.ts - q.s) * k; q.g += (q.tg - q.g) * k;
        q.ix += (q.tix - q.ix) * k; q.iy += (q.tiy - q.iy) * k;
        if (Math.abs(q.tx - q.rx) + Math.abs(q.ty - q.ry) + Math.abs(q.ts - q.s) * 50 + Math.abs(q.tg - q.g) > .02) busy = true;

        c.style.setProperty('--s', q.s.toFixed(4)); c.style.setProperty('--go', q.g.toFixed(3));

        c.style.setProperty('--sx', (-q.ry * 1.4).toFixed(1)); c.style.setProperty('--sy', (q.rx * 1.4).toFixed(1));
        c.style.setProperty('--ix', q.ix.toFixed(2) + 'px'); c.style.setProperty('--iy', q.iy.toFixed(2) + 'px');
      });
      if (busy) raf = W.requestAnimationFrame(frame);
    }
    function kick(){ if (!raf) raf = W.requestAnimationFrame(frame); }
    cards.forEach(function(c, i){
      var q = st[i];
      var move = function(e){
        if (e.pointerType === 'touch') return;

      var leave = function(){ q.tx = 0; q.ty = 0; q.ts = 1; q.tg = 0; q.tix = 0; q.tiy = 0; c.classList.remove('is-on'); kick(); };
      c.addEventListener('pointermove', move); c.addEventListener('pointerleave', leave);
      offs.push(function(){ c.removeEventListener('pointermove', move); c.removeEventListener('pointerleave', leave); });
    });
    var out = function(){ grid.classList.remove('is-hover'); };
    grid.addEventListener('pointerleave', out); offs.push(function(){ grid.removeEventListener('pointerleave', out); });
    return function(){ if (raf) W.cancelAnimationFrame(raf); offs.forEach(function(f){ f(); }); };
  }

/* ================= undo / redo ================= */
// every save() becomes one history step; rapid changes (slider drags, typing) are merged into one step
const HISTORY_MAX = 80;
const snap = () => JSON.stringify({page:store.page, sections:store.sections});
let lastSnap = snap(), undoStack = [], redoStack = [], histT = null;
function commitHistory(){
  clearTimeout(histT); histT = null;
  const now = snap();
  if (now === lastSnap) return;
  undoStack.push(lastSnap); if (undoStack.length > HISTORY_MAX) undoStack.shift();
  redoStack = []; lastSnap = now; updateUndoUI();
}
function save(){ persist(); clearTimeout(histT); histT = setTimeout(commitHistory, 400); updateUndoUI(); }
function applySnap(json, from){
  const o = JSON.parse(json), prev = JSON.parse(from);
  store.page = o.page; store.sections = o.sections;
  // land on the section that actually changed
  let ci = -1;
  const n = Math.max(o.sections.length, prev.sections.length);
  for (let i = 0; i < n; i++){ if (JSON.stringify(o.sections[i]) !== JSON.stringify(prev.sections[i])){ ci = i; break; } }
  if (ci < 0) ci = JSON.stringify(o.page) !== JSON.stringify(prev.page) ? -1 : store.cur;
  ci = Math.min(ci, store.sections.length - 1);
  if (editing){ editing.el.removeAttribute('contenteditable'); editing = null; }
  if (!$('imgdlg').hidden) closeImg();
  switchSection(ci, {render:true});
  persist(); updateUndoUI();
}
function undo(){
  if (histT) commitHistory();
  if (!undoStack.length){ toast('더 되돌릴 수정이 없어요'); return; }
  const cur = lastSnap; redoStack.push(cur); lastSnap = undoStack.pop();
  applySnap(lastSnap, cur); toast('되돌렸어요');
}
function redo(){
  if (histT) commitHistory();
  if (!redoStack.length){ toast('다시 실행할 수정이 없어요'); return; }
  const cur = lastSnap; undoStack.push(cur); lastSnap = redoStack.pop();
  applySnap(lastSnap, cur); toast('다시 실행했어요');
}
function updateUndoUI(){
  const u = document.getElementById('undo'), r = document.getElementById('redo');
  if (u) u.disabled = !undoStack.length && !histT;
  if (r) r.disabled = !redoStack.length;
}
function undoKeys(e){
  const mod = e.metaKey || e.ctrlKey; if (!mod || mode === 'gallery') return;
  const k = e.key.toLowerCase();
  const isUndo = k === 'z' && !e.shiftKey, isRedo = (k === 'z' && e.shiftKey) || (k === 'y' && e.ctrlKey && !e.metaKey);
  if (!isUndo && !isRedo) return;
  // let text fields keep their own undo while typing
  const ae = (e.target && e.target.ownerDocument || document).activeElement;
  if (editing) return;
  if (ae && (ae.isContentEditable || ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && /^(text|number|search|url|email)$/.test(ae.type)))) return;
  e.preventDefault();
  isUndo ? undo() : redo();
}

function fontAssets(names){

  const g = used.filter(f => FONTS[f].g), cssLinks = used.filter(f => FONTS[f].css);
  let head = '', faces = '';
  if (g.length) head += `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?${g.map(f=>'family='+FONTS[f].g).join('&')}&display=swap">\n`;
  cssLinks.forEach(f => head += `<link rel="stylesheet" crossorigin href="${FONTS[f].css}">\n`);
  used.filter(f => FONTS[f].custom).forEach(f => faces += `@font-face{font-family:'${f}';src:url('${FONTS[f].custom}') format('${FONTS[f].fmt}');font-weight:${FONTS[f].weight};font-display:swap}\n`);
  return {head, faces};
}
const needsJs = (t, st) => t.run && (t.key !== 'mlab' || st.spot.on);
function runtimeScript(list){

(function(){

var list = ${JSON.stringify(list.map(x => [x.t.key, x.st.id, x.t.cfg(x.st)]))};
function go(){ for (var i = 0; i < list.length; i++){ var r = document.querySelector('.hw-' + list[i][1]); if (r) W[list[i][0]](r, list[i][2]); } }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();
<\/script>`;
}
function buildExport(st, t=T){

function bindEdit(){
  doc.addEventListener('dblclick', e => {
    const hit = doc.elementFromPoint(e.clientX, e.clientY) || e.target;
    const el = hit.closest('[data-edit]');
    if (el){ if (el.isContentEditable) return; e.preventDefault(); startEdit(el.dataset.edit); return; }
    const im = hit.closest('[data-img]'); if (!im) return;
    e.preventDefault();
    let spec = im.dataset.img;
    if (spec.includes('#')){
      const ss = [...im.querySelectorAll('.hw-slide')];
      spec = spec.replace('#', Math.max(0, ss.findIndex(x => x.classList.contains('is-active'))));
    }
    openImg(spec.split('|'));
  });
  doc.addEventListener('keydown', e => {
    if (!editing) return;
    if (e.key === 'Escape'){ e.preventDefault(); endEdit(false); }
    else if (e.key === 'Enter'){
      e.preventDefault();
      if (editing.multi && !(e.metaKey || e.ctrlKey)) doc.execCommand('insertLineBreak');
      else endEdit(true);
    }
  }, true);
  doc.addEventListener('paste', e => {
    if (!editing) return;
    e.preventDefault();
    let t = (e.clipboardData || view.contentWindow.clipboardData).getData('text/plain');
    if (!editing.multi) t = t.replace(/\s*\n\s*/g,' ');
    doc.execCommand('insertText', false, t);

  doc.addEventListener('focusout', e => { if (editing && e.target === editing.el) endEdit(true); });
}
function bindDrag(){
  bindEdit();
  doc.addEventListener('pointerdown', e => {
    if (e.target.closest('[contenteditable="true"]')) return;
    const w = e.target.closest('[data-sec]');
    if (w && +w.dataset.sec !== store.cur) switchSection(+w.dataset.sec);
    const el = e.target.closest('[data-el]'); if (!el) return;
    const k = el.dataset.el; select(k);
    if (!T.drag[k]) return;
    e.preventDefault();
    drag = {k, sx:e.clientX, sy:e.clientY, o:baseOf(k), moved:false};
    try { doc.body.setPointerCapture?.(e.pointerId); } catch(_){}
  });
  doc.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (!drag.moved && Math.hypot(dx,dy) < 3) return;
    if (!drag.moved){ drag.moved = true; doc.body.classList.add('dragging'); }
    moveBy(drag.k, Math.round(dx), Math.round(dy), drag.o);
    renderCSS(); sync();
  });
  const end = () => { if (!drag) return; doc.body.classList.remove('dragging'); if (drag.moved){ save(); render(); } drag = null; };
  doc.addEventListener('pointerup', end); doc.addEventListener('pointercancel', end);
  doc.addEventListener('keydown', e => { if (!editing) nudge(e); });
}
function nudge(e){
  if (editing) return;
  if (!selected || !T.drag || !T.drag[selected] || !$('modal').hidden) return;
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  const st = e.shiftKey ? 10 : 1;
  const m = {ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if (!m){ if (e.key==='Escape') select(null,false); return; }
  e.preventDefault();
  moveBy(selected, m[0], m[1], baseOf(selected));
  renderCSS(); sync(); save();
}

    const k = el.dataset.k, v = get(k), f = FIELD[k];

    rail.querySelector(`[data-imghint="${k}"]`).textContent = v===FIELD[k].def ? '기본 더미 이미지예요. 실제 이미지로 바꿔주세요.' :
      v.startsWith('data:') ? `업로드한 파일 · 약 ${Math.round(v.length*.75/1024)}KB가 코드에 들어갑니다.` : '입력한 주소의 사진을 씁니다.';
  });

function parse(el){
  const f = FIELD[el.dataset.k];
  if (f.t==='range'){ const v = parseFloat(el.value); return isNaN(v) ? null : v; }
  if (f.t==='toggle') return el.checked;
  if (el.dataset.hex!==undefined) return /^#[0-9a-f]{6}$/i.test(el.value) ? el.value.toUpperCase() : null;
  if (f.t==='color') return el.value.toUpperCase();
  return el.value;

  const v = parse(el); if (v===null) return;

rail.addEventListener('change', async e => {
  const el = e.target;
  if (el.type!=='file' || !el.files.length) return;
  try {
    if (el.dataset.file){ set(el.dataset.file, await readImage(el.files[0])); }
    else if (el.dataset.slideFile!==undefined){ const i = +el.closest('.slide').dataset.i; S.pot.slides[i].src = await readImage(el.files[0]); showSlide = i; }
    else if (el.dataset.lfile){ const card = el.closest('[data-lk]'), i = +card.dataset.i; getRaw(card.dataset.lk)[i][el.dataset.lfile] = await readImage(el.files[0]); showSlide = i; refreshLists(); }
    else if (el.dataset.dnFile!==undefined){ const i = +el.closest('.slide').dataset.i; S.slides[i].poster = await readImage(el.files[0]); showSlide = i; if ($('dnslides')) $('dnslides').innerHTML = dnSlidesHTML(); }
    else if (el.dataset.slideAdd!==undefined){ for (const f of el.files) S.pot.slides.push({src: await readImage(f)}); showSlide = S.pot.slides.length-1; }
    if ($('slides')) $('slides').innerHTML = slidesHTML();
    render(); sync(); save(); toast('이미지를 넣었어요');
  } catch(err){ toast('이 파일은 읽을 수 없어요. JPG·PNG·WEBP 파일을 써주세요.'); }
  el.value = '';
});
function readImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => {
      if (/svg|gif/.test(file.type)) return res(fr.result);
      const img = new Image(); img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, 2000/Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL('image/webp', .86);
        if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
        res(out.length < fr.result.length ? out : fr.result);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  } else {
    code = JSON.stringify({format:'widget-style', version:1, type:T.key, name, settings:S}, null, 2);
    steps = '<div class="hint">이 위젯의 설정이에요. 보관해 두었다가 같은 위젯을 열고 이 칸에 붙여넣은 뒤 <b>이 설정 적용</b>을 누르면 그대로 복원돼요.</div>';

function buildGallery(){
  const q = gQ.trim().toLowerCase();
  const hitW = w => !q || [w.title, w.sub, w.no, groupName(w.cat, w.group), catName(w.cat)].join(' ').toLowerCase().includes(q);
  const hitS = x => !q || hitW(TPL[x.type]) || x.name.toLowerCase().includes(q);
  const cats = CATS.filter(([k]) => WIDGETS.some(w => w.cat === k));
  $('g-tabs').innerHTML = [['all','전체', WIDGETS.length], ...cats.map(([k,l]) => [k, l, WIDGETS.filter(w => w.cat === k).length]), ['mine','내 스타일', lib.styles.length]]
    .map(([k,l,n]) => `<button type="button" data-gcat="${k}" aria-pressed="${k === gCat}">${l} <small>${n}</small></button>`).join('');
  let html = '';
  if (gCat === 'mine'){
    const ss = lib.styles.filter(hitS).sort((a,b) => b.at - a.at);
    html = ss.length ? `<div class="g-grid">${ss.map(x => gCard(TPL[x.type], x)).join('')}</div>`

  } else {

      if (!ws.length) return '';

      const order = (GROUPS_UI[k] || []).map(x => x[0]), gi = w => { const i = order.indexOf(w.group); return i < 0 ? 99 : i; };
      const cards = [...ws].sort((x, y) => gi(x) - gi(y)).map(w => (hitW(w) ? gCard(w) : '') + lib.styles.filter(x => x.type === w.key && hitS(x)).map(x => gCard(w, x)).join('')).join('');
      return `<section class="g-group"><h3>${l} <small>${ws.length}</small></h3><div class="g-grid">${cards}</div></section>`;
    }).join('') || `<div class="g-empty">"${esc(gQ)}"에 맞는 위젯이 없어요.</div>`;
    if (gCat === 'all' && !q) html = `<div class="g-intro">위젯을 하나씩 열어 <b>속성을 다듬고 내 스타일로 저장</b>하세요. 완성한 위젯은 <b>HTML 내보내기</b>로 코드를 받을 수 있어요.</div>` + html;
  }
  if (gIO) gIO.disconnect();
  $('g-body').innerHTML = html;
  gIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ gIO.unobserve(e.target); loadThumb(e.target.querySelector('iframe')); } }), {root: $('g-body'), rootMargin: '300px 0px'});
  $('g-body').querySelectorAll('.g-thumb').forEach(b => gIO.observe(b));
  scaleThumbs();
}
gRO = new ResizeObserver(() => { if (mode === 'gallery') scaleThumbs(); });
gRO.observe($('g-body'));

function setHead(){
  if (mode === 'gallery'){
    $('crumb').innerHTML = '<svg class="ic" style="width:14px;height:14px"><use href="#i-grid"/></svg>위젯 빌더';
    $('page-title').textContent = '위젯 갤러리';
    $('brand-sub').textContent = `위젯 ${WIDGETS.length}개 · 내 스타일 ${lib.styles.length}개`;
  } else {
    const w = TPL[wType], st = wStyle && lib.styles.find(x => x.id === wStyle);
    $('crumb').innerHTML = '<button type="button" class="crumb-back" id="w-back"><svg class="ic"><use href="#i-left"/></svg>위젯 갤러리</button>';
    $('w-back').onclick = () => goGallery();
    const tr = $('page-title');
    tr.textContent = st ? st.name : w.title;
    $('brand-sub').innerHTML = (st ? `${esc(w.title)} 기반 내 스타일 · 자동 저장돼요` : `${w.no} · 기본형 · 고친 뒤 <b>내 스타일로 저장</b>하세요`) +
      (st ? ' <button type="button" class="icon-btn t-edit" id="w-rename" aria-label="스타일 이름 바꾸기" title="이름 바꾸기"><svg class="ic"><use href="#i-edit"/></svg></button>' : '');
    if (st) $('w-rename').onclick = () => renameStyle(st.id);
    $('w-save').innerHTML = `<svg class="ic"><use href="#i-save"/></svg>${st ? '다른 스타일로 저장' : '내 스타일로 저장'}`;
    $('w-save').className = 'btn w-only' + (st ? '' : ' primary');
    $('export').className = 'btn' + (st ? ' primary' : '');
  }
}
function setMode(m){
  mode = m;
  $('app').classList.toggle('mode-gallery', m === 'gallery');
  $('app').classList.toggle('mode-widget', m === 'widget');
  $('gallery').hidden = m !== 'gallery';
  if (m !== 'gallery' && gIO){ gIO.disconnect(); $('g-body').innerHTML = ''; }
}
// close the widget editor (saves the style being edited)
function leaveWidget(){
  if (mode !== 'widget') return;
  if (editing) endEdit(true);
  flushSave();
  clearTimeout(histT); histT = null;
  stops.forEach(f => f()); stops = [];
  wStyle = null; wType = null;
}
async function okToLeaveDraft(){
  if (mode !== 'widget' || wStyle) return true;
  if (histT) commitHistory();
  if (snap() === baseSnap) return true;
  return confirmDlg({title:'수정한 내용을 버릴까요?', body:`<strong>${esc(TPL[wType].title)}</strong> 기본형에서 고친 내용이 아직 저장되지 않았어요. 남기려면 취소한 뒤 <strong>내 스타일로 저장</strong>을 누르세요.`, ok:'저장하지 않고 나가기'});
}
async function goGallery(){
  if (mode === 'gallery') return;
  if (!(await okToLeaveDraft())) return;
  if (editing) endEdit(true);
  if (!$('pv').hidden) closePreview();
  leaveWidget(); closeCtx();
  gQ = ''; $('g-search').value = '';
  setMode('gallery'); buildGallery(); setHead();
  $('g-body').scrollTop = 0;
}
function openWidget(type, styleId){
  if (editing) endEdit(true);
  if (histT) commitHistory();
  if (mode === 'widget') leaveWidget();
  const st = styleId && lib.styles.find(x => x.id === styleId);
  store = {page: {...PAGE.defaults(), title: st ? st.name : TPL[type].title}, sections:[{type, s: st ? clone(st.s) : TPL[type].defaults()}], cur:0};
  undoStack = []; redoStack = []; lastSnap = baseSnap = snap();
  wStyle = st ? st.id : null; wType = type;
  setMode('widget');
  switchSection(0, {render:true});
  stage.scrollTop = 0; updateUndoUI();
}
async function renameStyle(id){
  const st = lib.styles.find(x => x.id === id); if (!st) return;
  const name = await confirmDlg({title:'스타일 이름 바꾸기', body:'', ok:'바꾸기', danger:false, input:st.name});
  if (!name) return;
  st.name = name; saveLib(); setHead();
  if (mode === 'gallery') buildGallery();
  toast('이름을 바꿨어요');
}
async function delStyle(id){
  const st = lib.styles.find(x => x.id === id); if (!st) return;
  const ok = await confirmDlg({title:'내 스타일을 삭제할까요?', body:`<strong>${esc(st.name)}</strong> 스타일이 갤러리에서 사라져요.<small>삭제한 스타일은 되돌릴 수 없어요.</small>`, ok:'삭제'});
  if (!ok) return;
  lib.styles = lib.styles.filter(x => x.id !== id); saveLib(); setHead(); buildGallery();
  toast('스타일을 삭제했어요');
}

$('g-tabs').addEventListener('click', e => { const b = e.target.closest('[data-gcat]'); if (!b) return; gCat = b.dataset.gcat; buildGallery(); });
$('g-search').addEventListener('input', e => { gQ = e.target.value; buildGallery(); });
$('g-body').addEventListener('click', e => {
  const b = e.target.closest('[data-ga]'); if (!b) return;
  const card = b.closest('.g-card'), type = card.dataset.type, sid = card.dataset.style;
  const st = sid && lib.styles.find(x => x.id === sid);
  if (b.dataset.ga === 'edit') openWidget(type, sid);
  else if (b.dataset.ga === 'more'){ const r = b.getBoundingClientRect(); openStyleMenu(sid, r.right - 190, r.bottom + 6); }
});
$('g-body').addEventListener('contextmenu', e => {
  const card = e.target.closest('.g-card[data-style]:not([data-style=""])'); if (!card) return;
  e.preventDefault(); openStyleMenu(card.dataset.style, e.clientX, e.clientY);
});
let menuStyle = null;
function openStyleMenu(id, x, y){
  const st = lib.styles.find(s => s.id === id), ctx = $('ctx'); if (!st) return;
  menuStyle = id;
  ctx.innerHTML = `<div class="ctx-head">${esc(st.name)}</div>
    <button type="button" role="menuitem" data-gm="edit"><svg class="ic"><use href="#i-edit"/></svg>편집</button>
    <button type="button" role="menuitem" data-gm="rename"><svg class="ic"><use href="#i-edit"/></svg>이름 바꾸기</button>
    <button type="button" role="menuitem" data-gm="dup"><svg class="ic"><use href="#i-copy"/></svg>복제</button>
    <hr>
    <button type="button" role="menuitem" class="danger" data-gm="del"><svg class="ic"><use href="#i-trash"/></svg>삭제</button>`;
  ctx.hidden = false;
  const r = ctx.getBoundingClientRect();
  ctx.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  ctx.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  ctx.querySelector('button').focus();
}
$('ctx').addEventListener('click', e => {
  const b = e.target.closest('[data-gm]'); if (!b) return;
  const id = menuStyle, st = lib.styles.find(x => x.id === id); closeCtx(); if (!st) return;
  const a = b.dataset.gm;
  if (a === 'edit') openWidget(st.type, id);
  else if (a === 'rename') renameStyle(id);
  else if (a === 'del') delStyle(id);
  else if (a === 'dup'){
    const c = {id: uid(), type: st.type, name: `${st.name} 복사본`, at: Date.now(), s: clone(st.s)};
    lib.styles.splice(lib.styles.indexOf(st) + 1, 0, c); saveLib(); setHead(); buildGallery(); toast('스타일을 복제했어요');
  }
});
$('g-body').addEventListener('scroll', () => closeCtx());

// single widget: save as my style
$('w-save').onclick = async () => {
  if (histT) commitHistory();
  const st = await saveAsStyle(wType, store.sections[0].s);
  if (!st) return;
  wStyle = st.id; baseSnap = snap();
  setHead(); buildRail();
};
/* ================= device preview ================= */
let pvW = 1920, pvH = 1080;
const devName = w => ({1920:'PC', 768:'태블릿', 390:'모바일'})[w] || '';
function fitPv(){
  const st = $('pv-stage'), fr = $('pv-frame'), v = $('pv-view');
  const pad = pvW < 1000 ? 64 : 48;
  const s = Math.min(1, (st.clientWidth - pad) / pvW, (st.clientHeight - pad) / pvH);
  v.style.width = pvW + 'px'; v.style.height = pvH + 'px'; v.style.transform = `scale(${s})`;
  fr.style.width = pvW * s + 'px'; fr.style.height = pvH * s + 'px';
  fr.classList.toggle('phone', pvW < 600); fr.classList.toggle('tablet', pvW >= 600 && pvW < 1000);
  $('pv-label').textContent = `${devName(pvW)} · ${pvW}×${pvH} · ${Math.round(s * 100)}%`;
}
function loadPv(){
  const v = $('pv-view');
  v.onload = () => { loadFonts(v.contentWindow, v.contentDocument); };
  v.srcdoc = buildPage();
  fitPv();
}
function openPreview(){
  if (editing) endEdit(true);
  pvW = devW; pvH = devH;
  $('pv-dev').querySelectorAll('[data-dev]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.dev === `${pvW}x${pvH}`)));
  $('pv').hidden = false; loadPv(); $('pv-close').focus();
}
function closePreview(){ $('pv').hidden = true; $('pv-view').srcdoc = ''; $('preview').focus(); }
$('preview').onclick = openPreview;
$('pv-close').onclick = closePreview;
$('pv-reload').onclick = loadPv;
$('pv-dev').addEventListener('click', e => {
  const b = e.target.closest('[data-dev]'); if (!b) return;
  [pvW, pvH] = b.dataset.dev.split('x').map(Number);
  $('pv-dev').querySelectorAll('[data-dev]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  loadPv();
});
window.addEventListener('resize', () => { if (!$('pv').hidden) fitPv(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('pv').hidden) closePreview(); });

/* ================= shell ================= */
(async () => {
  try { const buf = await (await fetch('p/pretendard.woff2')).arrayBuffer(); const f = new FontFace('Pretendard UI', buf, {weight:'45 920'}); await f.load(); document.fonts.add(f); } catch(e) {}
})();

/* ================= boot ================= */
$('undo').onclick = undo; $('redo').onclick = redo;
lastSnap = snap(); updateUndoUI();
setMode('gallery'); buildGallery(); setHead();
})();
</script>

</body>
</html>
